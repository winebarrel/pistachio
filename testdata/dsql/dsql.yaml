  - query: |2-

      		WITH
      			-- One row per pg_constraint row: the conkey columns in conkey
      			-- order. Grouped by con.oid so each constraint gets only its own
      			-- columns; previously this CTE grouped by attrelid, which made
      			-- every constraint on the same table inherit the union of all
      			-- constraint columns (and on PG18 the contype='n' rows added
      			-- duplicates).
      			column_t AS (
      				SELECT
      					con.oid AS con_oid,
      					array_agg(
      						a.attname
      						ORDER BY
      							array_position(con.conkey, a.attnum)
      					) AS attnames
      				FROM
      					pg_catalog.pg_constraint con
      					JOIN pg_catalog.pg_attribute a ON a.attrelid = con.conrelid
      					AND a.attnum = ANY(con.conkey)
      				WHERE
      					con.conrelid = ANY($1::oid[])
      				GROUP BY
      					con.oid
      			)
      		SELECT
      			con.conrelid,
      			con.oid,
      			con.conname,
      			con.contype,
      			pg_catalog.pg_get_constraintdef(con.oid, true) AS definition,
      			col.attnames AS columns,
      			con.condeferrable,
      			con.condeferred,
      			con.convalidated,
      			-- False on a constraint an INHERITS child only inherits. The
      			-- child's CREATE TABLE does not write one, so reading it planned a
      			-- DROP CONSTRAINT that PostgreSQL rejects anyway.
      			con.conislocal,
