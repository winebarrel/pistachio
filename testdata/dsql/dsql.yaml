      			AND d.classoid = 'pg_type'::regclass
      			AND d.objsubid = 0
      			LEFT JOIN dependency_extension de ON de.objid = t.oid
      		WHERE
      			t.typtype = 'e'
      			AND n.nspname = ANY($1)
      			AND de.objid IS NULL
      		GROUP BY
      			t.oid,
      			n.nspname,
      			t.typname,
      			d.description
      		ORDER BY
      			n.nspname,
      			t.typname
      	
