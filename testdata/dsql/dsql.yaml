      			iseq.seqmin,
      			iseq.seqmax,
      			iseq.seqincrement,
      			iseq.seqcache,
      			iseq.seqcycle
      		FROM
      			pg_catalog.pg_attribute a
      			JOIN pg_catalog.pg_type t ON t.oid = a.atttypid
      			LEFT JOIN pg_catalog.pg_attrdef ad ON ad.adrelid = a.attrelid
