  - query: |2-

      		WITH
      			dependency_extension AS (
      				SELECT DISTINCT
      					d.objid
      				FROM
      					pg_catalog.pg_depend d
      				WHERE
      					d.deptype = 'e'
      			)
      		SELECT
      			c.oid,
      			n.nspname,
      			c.relname,
      			pg_catalog.pg_get_viewdef(c.oid, true) AS definition,
      			c.relkind = 'm' AS materialized,
      			(
      				SELECT
      					lower(split_part(o, '=', 2))
      				FROM
      					unnest(c.reloptions) AS o
      				WHERE
      					o LIKE 'check_option=%'
      			) AS check_option,
      			c.reloptions,
      			tc.reloptions AS toast_reloptions,
      			d.description,
      			cc.names AS column_comment_names,
      			cc.comments AS column_comments
      		FROM
      			pg_catalog.pg_class c
      			JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
      			LEFT JOIN pg_catalog.pg_class tc ON tc.oid = c.reltoastrelid
      			LEFT JOIN dependency_extension de ON de.objid = c.oid
      			LEFT JOIN pg_catalog.pg_description d ON d.objoid = c.oid
      			AND d.classoid = 'pg_catalog.pg_class'::regclass
      			AND d.objsubid = 0
      			CROSS JOIN LATERAL (
      				SELECT
      					coalesce(array_agg(a.attname ORDER BY a.attnum), '{}') AS names,
      					coalesce(array_agg(ad.description ORDER BY a.attnum), '{}') AS comments
      				FROM
      					pg_catalog.pg_attribute a
      					JOIN pg_catalog.pg_description ad ON ad.objoid = a.attrelid
      					AND ad.classoid = 'pg_catalog.pg_class'::regclass
      					AND ad.objsubid = a.attnum
      				WHERE
      					a.attrelid = c.oid
      					AND a.attnum > 0
      					AND NOT a.attisdropped
      			) cc
      		WHERE
      			c.relkind IN ('v', 'm')
      			AND n.nspname = ANY($1)
      			AND de.objid IS NULL
      		ORDER BY
      			n.nspname,
      			c.relname
      	
