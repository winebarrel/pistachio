      			LEFT JOIN dependency_extension de ON de.objid = t.oid
      			-- https://www.postgresql.org/docs/current/catalog-pg-description.html
      			LEFT JOIN pg_catalog.pg_description descr ON descr.objoid = t.oid
      			AND descr.classoid = 'pg_trigger'::regclass
      			AND descr.objsubid = 0
      		WHERE
      			n.nspname = ANY($1)
      			AND de.objid IS NULL
      			-- The triggers behind a foreign key or a deferred unique
      			-- constraint. PostgreSQL installs and drops them with the
      			-- constraint, so they are not part of the schema.
      			AND NOT t.tgisinternal
      			-- A trigger on a partitioned table is cloned onto every partition
      			-- with tgparentid pointing back at the parent. The clone cannot be
      			-- dropped on its own, and the parent's definition already covers
      			-- it, so only the parent's row belongs to the model.
      			AND t.tgparentid = 0
      		ORDER BY
      			n.nspname,
      			c.relname,
      			t.tgname
      	
    args: ['{public}']
    param_types: [_name]
    columns: [nspname, relname, tgname, definition, tgenabled, comment]
    types: [name, name, name, text, char, text]
  - query: |2-

      		WITH
      			dependency_extension AS (
      				SELECT DISTINCT
      					d.objid
      				FROM
      					pg_catalog.pg_depend d
      				WHERE
      					d.deptype = 'e'
      			)
      		SELECT
      			t.oid,
      			n.nspname,
      			t.typname,
      			array_remove(array_agg(e.enumlabel ORDER BY e.enumsortorder), NULL) AS vals,
      			d.description
      		FROM
      			pg_catalog.pg_type t
      			JOIN pg_catalog.pg_namespace n ON n.oid = t.typnamespace
      			-- An enum with no labels has no pg_enum row. An inner join would
      			-- drop the type from the result, so every plan would create it
      			-- again and the second apply would fail.
      			LEFT JOIN pg_catalog.pg_enum e ON e.enumtypid = t.oid
      			LEFT JOIN pg_catalog.pg_description d ON d.objoid = t.oid
      			AND d.classoid = 'pg_type'::regclass
      			AND d.objsubid = 0
      			LEFT JOIN dependency_extension de ON de.objid = t.oid
      		WHERE
      			t.typtype = 'e'
      			AND n.nspname = ANY($1)
      			AND de.objid IS NULL
      		GROUP BY
      			t.oid,
      			n.nspname,
      			t.typname,
      			d.description
      		ORDER BY
      			n.nspname,
      			t.typname
      	
