  - query: |2-

      		-- https://www.postgresql.org/docs/current/catalog-pg-attribute.html
      		SELECT
      			a.attrelid,
      			a.attname,
      			-- False on a column an INHERITS child only inherits. Such a column
      			-- is not written by the child's CREATE TABLE, so the desired side
      			-- never holds it; reading it here planned a DROP COLUMN for it. A
      			-- column the child redeclares is local and inherited at once, and
      			-- stays.
      			a.attislocal,
      			-- A serial type only while the sequence has the default name.
      			-- Any other column that takes its default from a sequence it
      			-- owns keeps its own type and default, and catalog/sequences.go
      			-- reads the sequence, so that dump writes its name and options.
      			CASE
      				WHEN s.is_serial
      				AND seqc.relname = tc.relname || '_' || a.attname || '_seq'
      				THEN CASE pg_catalog.format_type(a.atttypid, a.atttypmod)
      					WHEN 'integer' THEN 'serial'
      					WHEN 'bigint' THEN 'bigserial'
      					WHEN 'smallint' THEN 'smallserial'
      					ELSE pg_catalog.format_type(a.atttypid, a.atttypmod)
      				END
      				ELSE pg_catalog.format_type(a.atttypid, a.atttypmod)
      			END AS type_name,
      			-- The sequence a column owns and takes its default from, whatever
      			-- its name. The diff uses it to change the sequence type with a
      			-- serial column's type: bigserial is a bigint column and a bigint
      			-- sequence, and ALTER TABLE changes only the column. NULL for
      			-- every other column.
      			CASE
      				WHEN s.is_serial
      				THEN pg_catalog.pg_get_serial_sequence(a.attrelid::regclass::text, a.attname)
      			END AS serial_sequence,
      			a.attnotnull,
      			-- PG18 stores per-column NOT NULL as pg_constraint rows with
      			-- contype='n' and a single conkey entry. Pre-PG18 has no such row,
      			-- so the LEFT JOIN yields NULL there.
      			nn.conname AS not_null_name,
      			-- Kept on a serial column too, for a desired schema that writes
      			-- the nextval() default out rather than the serial type.
      			pg_catalog.pg_get_expr(ad.adbin, ad.adrelid) AS default,
      			a.attidentity,
      			a.attgenerated,
      			quote_ident(con.nspname) || '.' || quote_ident(co.collname) AS collation,
      			-- attstorage always holds a strategy, so the type's own is read
      			-- alongside it: a column left at the default is only visible as
      			-- the two being equal.
      			COALESCE(CASE a.attstorage
      				WHEN 'p' THEN 'plain'
      				WHEN 'e' THEN 'external'
      				WHEN 'x' THEN 'extended'
      				WHEN 'm' THEN 'main'
      			END, '') AS storage_type,
      			COALESCE(CASE t.typstorage
      				WHEN 'p' THEN 'plain'
      				WHEN 'e' THEN 'external'
      				WHEN 'x' THEN 'extended'
      				WHEN 'm' THEN 'main'
      			END, '') AS type_storage,
      			CASE a.attcompression
      				WHEN 'p' THEN 'pglz'
      				WHEN 'l' THEN 'lz4'
      				ELSE ''
      			END AS compression,
      			d.description,
      			iseq.seqstart,
      			iseq.seqmin,
      			iseq.seqmax,
      			iseq.seqincrement,
      			iseq.seqcache,
      			iseq.seqcycle
      		FROM
      			pg_catalog.pg_attribute a
      			JOIN pg_catalog.pg_type t ON t.oid = a.atttypid
      			LEFT JOIN pg_catalog.pg_attrdef ad ON ad.adrelid = a.attrelid
      			AND ad.adnum = a.attnum
      			-- A column is serial only when it owns a sequence *and* its default
      			-- actually draws from that sequence. A plain
      			-- "ALTER SEQUENCE ... OWNED BY" creates the same dependency without
      			-- touching the default, and treating that as serial would drop the
      			-- real default from the dumped definition.
      			CROSS JOIN LATERAL (
      				SELECT COALESCE(
      					a.attidentity = ''
      					-- Round-trip the sequence name through regclass so it is
      					-- rendered the same way pg_get_expr renders it:
      					-- pg_get_serial_sequence always schema-qualifies, while
      					-- pg_get_expr omits the schema when it is on search_path.
      					AND pg_catalog.pg_get_expr(ad.adbin, ad.adrelid) = 'nextval('
      						|| quote_literal(pg_catalog.pg_get_serial_sequence(a.attrelid::regclass::text, a.attname)::regclass::text)
      						|| '::regclass)',
      					false
      				) AS is_serial
      			) s
      			JOIN pg_catalog.pg_class tc ON tc.oid = a.attrelid
      			LEFT JOIN pg_catalog.pg_class seqc ON s.is_serial
      			AND seqc.oid = pg_catalog.pg_get_serial_sequence(a.attrelid::regclass::text, a.attname)::regclass
      			LEFT JOIN pg_catalog.pg_collation co ON co.OID = a.attcollation
      			AND co.oid != t.typcollation
      			LEFT JOIN pg_catalog.pg_namespace con ON con.oid = co.collnamespace
      			-- https://www.postgresql.org/docs/current/catalog-pg-description.html
      			LEFT JOIN pg_catalog.pg_description d ON d.objoid = a.attrelid
      			AND d.classoid = 'pg_catalog.pg_class'::regclass
      			AND d.objsubid = a.attnum
      			LEFT JOIN pg_catalog.pg_constraint nn ON nn.conrelid = a.attrelid
      			AND nn.contype = 'n'
      			AND nn.conkey = ARRAY[a.attnum]
      			-- The sequence behind an identity column. deptype 'i' marks it,
      			-- and only an identity column has one, so the join is empty for
      			-- every other column including a serial one (deptype 'a').
      			LEFT JOIN LATERAL (
      				SELECT
      					sq.*
      				FROM
      					pg_catalog.pg_depend dep
      					JOIN pg_catalog.pg_sequence sq ON sq.seqrelid = dep.objid
      				WHERE
      					dep.classid = 'pg_class'::regclass
      					AND dep.refclassid = 'pg_class'::regclass
      					AND dep.deptype = 'i'
      					AND dep.refobjid = a.attrelid
      					AND dep.refobjsubid = a.attnum
      			) iseq ON true
      		WHERE
      			a.attrelid = ANY($1::oid[])
      			AND a.attnum >= 1
      			AND NOT a.attisdropped
      		ORDER BY
      			a.attrelid,
      			a.attnum
      	
