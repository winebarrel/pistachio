      			),
      			-- https://www.postgresql.org/docs/current/catalog-pg-depend.html
      			dependency_extension AS (
      				SELECT DISTINCT
      					d.objid
      				FROM
      					pg_catalog.pg_depend d
      				WHERE
      					d.deptype = 'e'
      			)
