      			JOIN pg_catalog.pg_namespace n ON n.oid = t.typnamespace
      			JOIN pg_catalog.pg_type bt ON bt.oid = t.typbasetype
      			LEFT JOIN pg_catalog.pg_description d ON d.objoid = t.oid
      			AND d.classoid = 'pg_type'::regclass
