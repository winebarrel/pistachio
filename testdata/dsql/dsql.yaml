      		SELECT
      			t.oid,
      			n.nspname,
      			t.typname,
      			array_remove(array_agg(e.enumlabel ORDER BY e.enumsortorder), NULL) AS vals,
      			d.description
      		FROM
      			pg_catalog.pg_type t
      			JOIN pg_catalog.pg_namespace n ON n.oid = t.typnamespace
