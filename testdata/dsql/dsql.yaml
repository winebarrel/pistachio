  - query: |2-

      		WITH
      			-- One row per pg_constraint row: the conkey columns in conkey
      			-- order. Grouped by con.oid so each constraint gets only its own
      			-- columns; previously this CTE grouped by attrelid, which made
      			-- every constraint on the same table inherit the union of all
      			-- constraint columns (and on PG18 the contype='n' rows added
      			-- duplicates).
      			column_t AS (
      				SELECT
      					con.oid AS con_oid,
      					array_agg(
      						a.attname
      						ORDER BY
      							array_position(con.conkey, a.attnum)
      					) AS attnames
      				FROM
      					pg_catalog.pg_constraint con
      					JOIN pg_catalog.pg_attribute a ON a.attrelid = con.conrelid
      					AND a.attnum = ANY(con.conkey)
      				WHERE
      					con.conrelid = ANY($1::oid[])
      				GROUP BY
      					con.oid
      			)
      		SELECT
      			con.conrelid,
      			con.oid,
      			con.conname,
      			con.contype,
      			pg_catalog.pg_get_constraintdef(con.oid, true) AS definition,
      			col.attnames AS columns,
      			con.condeferrable,
      			con.condeferred,
      			con.convalidated,
      			-- False on a constraint an INHERITS child only inherits. The
      			-- child's CREATE TABLE does not write one, so reading it planned a
      			-- DROP CONSTRAINT that PostgreSQL rejects anyway.
      			con.conislocal,
      			-- The storage parameters of the index the constraint owns.
      			-- pg_get_constraintdef does not print them for a primary key or a
      			-- unique constraint, so they are appended to the definition below.
      			-- It does print them for an exclusion constraint, and a foreign
      			-- key's conindid names the referenced table's index, whose
      			-- parameters are not part of the key, so the CASE keeps both out.
      			CASE WHEN con.contype = ANY ('{p,u}'::"char"[]) THEN ci.reloptions END AS index_options,
      			rn.nspname AS ref_schema,
      			rc.relname AS ref_table,
      			descr.description AS comment
      		FROM
      			-- https://www.postgresql.org/docs/current/catalog-pg-constraint.html
      			pg_catalog.pg_constraint con
      			LEFT JOIN pg_catalog.pg_class rc ON rc.oid = con.confrelid
      			LEFT JOIN pg_catalog.pg_namespace rn ON rn.oid = rc.relnamespace
      			LEFT JOIN pg_catalog.pg_class ci ON ci.oid = con.conindid
      			LEFT JOIN column_t col ON col.con_oid = con.oid
      			-- https://www.postgresql.org/docs/current/catalog-pg-description.html
      			LEFT JOIN pg_catalog.pg_description descr ON descr.objoid = con.oid
      			AND descr.classoid = 'pg_constraint'::regclass
      			AND descr.objsubid = 0
      		WHERE
      			con.conrelid = ANY($1::oid[])
      			-- The table-level constraint types, listed the way the ORDER BY
      			-- below lists them. Two other types share the catalog and belong
      			-- elsewhere. PG18's per-column NOT NULL rows (contype='n') are
      			-- read into Column.NotNull / Column.NotNullName by
      			-- ListColumnsByTables. CREATE CONSTRAINT TRIGGER records the
      			-- trigger here too (contype='t'), where pg_get_constraintdef
      			-- renders it as the bare word TRIGGER, followed by the deferral
