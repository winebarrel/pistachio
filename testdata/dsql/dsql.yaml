      		SELECT
      			pol.polrelid,
      			pol.polname,
      			pol.polpermissive,
      			pol.polcmd,
      			COALESCE(
      				(
      					SELECT array_agg(rolname ORDER BY rolname)
      					FROM (
      						SELECT 'public'::name AS rolname
      						WHERE 0 = ANY(pol.polroles)
      						UNION
