# A table renamed after its serial column was created keeps the old sequence
# name, so the column is written with its type and default and the sequence
# is written out.
init: |
  CREATE TABLE public.users (
      id serial NOT NULL
  );
  ALTER TABLE public.users RENAME TO accounts;
dump: |
  -- public.users_id_seq
  CREATE SEQUENCE public.users_id_seq
      AS integer
      START WITH 1
      INCREMENT BY 1
      MINVALUE 1
      MAXVALUE 2147483647
      CACHE 1;

  -- public.accounts
  CREATE TABLE public.accounts (
      id integer DEFAULT nextval('users_id_seq'::regclass) NOT NULL
  );

  ALTER SEQUENCE public.users_id_seq OWNED BY public.accounts.id;
# PG18 keeps the automatic NOT NULL name across the table rename.
dump_pg18: |
  -- public.users_id_seq
  CREATE SEQUENCE public.users_id_seq
      AS integer
      START WITH 1
      INCREMENT BY 1
      MINVALUE 1
      MAXVALUE 2147483647
      CACHE 1;

  -- public.accounts
  CREATE TABLE public.accounts (
      id integer DEFAULT nextval('users_id_seq'::regclass) CONSTRAINT users_id_not_null NOT NULL
  );

  ALTER SEQUENCE public.users_id_seq OWNED BY public.accounts.id;
