init: |
  CREATE TABLE public.parents (
      a integer NOT NULL,
      b integer NOT NULL,
      CONSTRAINT parents_pkey PRIMARY KEY (a, b)
  );
  CREATE TABLE public.children (
      a integer,
      b integer,
      CONSTRAINT children_a_b_fkey FOREIGN KEY (a, b) REFERENCES public.parents (a, b) MATCH FULL
  );
