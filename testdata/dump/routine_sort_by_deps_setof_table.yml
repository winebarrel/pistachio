# A routine whose signature names a relation sorts after that relation, so the
# dump can be applied as written. The wholesale "table depends on routine" edge
# skips this pair.
manage_routine: true
sort_by_deps: true
init: |
  CREATE TABLE public.users (id integer NOT NULL);
  CREATE FUNCTION public.all_users() RETURNS SETOF public.users
      LANGUAGE sql AS $$ SELECT * FROM public.users $$;
dump: |
  -- public.users
  CREATE TABLE public.users (
      id integer NOT NULL
  );

  -- public.all_users()
  CREATE OR REPLACE FUNCTION public.all_users()
      RETURNS SETOF users
      LANGUAGE sql
      AS $$ SELECT * FROM public.users $$;
