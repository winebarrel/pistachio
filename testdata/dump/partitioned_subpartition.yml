# A partition that is itself partitioned must keep its own PARTITION BY,
# or the dump defines it as a leaf and the level below it fails to reload.
init: |
  CREATE TABLE public.events (
      id integer NOT NULL,
      region text NOT NULL,
      kind text NOT NULL
  ) PARTITION BY RANGE (region);
  CREATE TABLE public.events_east PARTITION OF public.events FOR VALUES FROM ('a') TO ('m') PARTITION BY LIST (kind);
  CREATE TABLE public.events_east_web PARTITION OF public.events_east FOR VALUES IN ('web');
dump: |
  -- public.events
  CREATE TABLE public.events (
      id integer NOT NULL,
      region text NOT NULL,
      kind text NOT NULL
  )
  PARTITION BY RANGE (region);

  -- public.events_east
  CREATE TABLE public.events_east PARTITION OF public.events FOR VALUES FROM ('a') TO ('m')
  PARTITION BY LIST (kind);

  -- public.events_east_web
  CREATE TABLE public.events_east_web PARTITION OF public.events_east FOR VALUES IN ('web');
