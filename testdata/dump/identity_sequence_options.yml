init: |
  CREATE TABLE public.items (
      id integer GENERATED ALWAYS AS IDENTITY (START WITH 100 INCREMENT BY 5 CACHE 20),
      down bigint GENERATED BY DEFAULT AS IDENTITY (INCREMENT BY -1 CYCLE),
      plain integer GENERATED ALWAYS AS IDENTITY,
      name text NOT NULL
  );
