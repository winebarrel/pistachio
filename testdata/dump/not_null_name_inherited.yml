# On PG18 a partition and an INHERITS child take the parent's NOT NULL name.
# Their inherited columns are not written, so the name does not appear.
min_pg: 18
init: |
  CREATE TABLE public.p (
      id integer NOT NULL,
      k integer NOT NULL
  ) PARTITION BY RANGE (k);
  CREATE TABLE public.p1 PARTITION OF public.p FOR VALUES FROM (0) TO (10);
  CREATE TABLE public.base (
      id integer NOT NULL
  );
  CREATE TABLE public.child (
      x integer
  ) INHERITS (public.base);
dump: |
  -- public.base
  CREATE TABLE public.base (
      id integer NOT NULL
  );

  -- public.child
  CREATE TABLE public.child (
      x integer
  )
  INHERITS (public.base);

  -- public.p
  CREATE TABLE public.p (
      id integer NOT NULL,
      k integer NOT NULL
  )
  PARTITION BY RANGE (k);

  -- public.p1
  CREATE TABLE public.p1 PARTITION OF public.p FOR VALUES FROM (0) TO (10);
