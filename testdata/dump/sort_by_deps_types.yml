# items depends on the domain pos_int (column type) and the sequence id_seq
# (nextval default), so both are emitted before the table.
sort_by_deps: true
init: |
  CREATE DOMAIN public.pos_int AS integer CONSTRAINT pos_check CHECK (VALUE > 0);
  CREATE SEQUENCE public.id_seq;
  CREATE TABLE public.items (
      id integer DEFAULT nextval('public.id_seq'::regclass) NOT NULL,
      qty public.pos_int NOT NULL,
      CONSTRAINT items_pkey PRIMARY KEY (id)
  );
dump: |
  -- public.id_seq
  CREATE SEQUENCE public.id_seq
      AS bigint
      START WITH 1
      INCREMENT BY 1
      MINVALUE 1
      MAXVALUE 9223372036854775807
      CACHE 1;

  -- public.pos_int
  CREATE DOMAIN public.pos_int AS integer
      CONSTRAINT pos_check CHECK ((VALUE > 0));

  -- public.items
  CREATE TABLE public.items (
      id integer DEFAULT nextval('id_seq'::regclass) NOT NULL,
      qty pos_int NOT NULL,
      CONSTRAINT items_pkey PRIMARY KEY (id)
  );
