# A serial sequence whose options were changed is written out with them, since
# serial would restore it with the default options.
init: |
  CREATE TABLE public.t (
      id serial NOT NULL
  );
  ALTER SEQUENCE public.t_id_seq INCREMENT BY 10 START WITH 100 CACHE 5;
dump: |
  -- public.t_id_seq
  CREATE SEQUENCE public.t_id_seq
      AS integer
      START WITH 100
      INCREMENT BY 10
      MINVALUE 1
      MAXVALUE 2147483647
      CACHE 5;

  -- public.t
  CREATE TABLE public.t (
      id integer DEFAULT nextval('t_id_seq'::regclass) NOT NULL
  );

  ALTER SEQUENCE public.t_id_seq OWNED BY public.t.id;
dump_pg18: |
  -- public.t_id_seq
  CREATE SEQUENCE public.t_id_seq
      AS integer
      START WITH 100
      INCREMENT BY 10
      MINVALUE 1
      MAXVALUE 2147483647
      CACHE 5;

  -- public.t
  CREATE TABLE public.t (
      id integer DEFAULT nextval('t_id_seq'::regclass) CONSTRAINT t_id_not_null NOT NULL
  );

  ALTER SEQUENCE public.t_id_seq OWNED BY public.t.id;
