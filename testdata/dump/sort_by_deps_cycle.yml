# Mutual foreign keys form a dependency cycle. The topological sort fails, so
# the dump falls back to the name order (alphabetical: a before b).
sort_by_deps: true
init: |
  CREATE TABLE public.a (
      id integer NOT NULL,
      b_id integer,
      CONSTRAINT a_pkey PRIMARY KEY (id)
  );
  CREATE TABLE public.b (
      id integer NOT NULL,
      a_id integer,
      CONSTRAINT b_pkey PRIMARY KEY (id)
  );
  ALTER TABLE ONLY public.a ADD CONSTRAINT a_b_fkey FOREIGN KEY (b_id) REFERENCES b(id);
  ALTER TABLE ONLY public.b ADD CONSTRAINT b_a_fkey FOREIGN KEY (a_id) REFERENCES a(id);
dump: |
  -- public.a
  CREATE TABLE public.a (
      id integer NOT NULL,
      b_id integer,
      CONSTRAINT a_pkey PRIMARY KEY (id)
  );

  ALTER TABLE ONLY public.a ADD CONSTRAINT a_b_fkey FOREIGN KEY (b_id) REFERENCES b(id);

  -- public.b
  CREATE TABLE public.b (
      id integer NOT NULL,
      a_id integer,
      CONSTRAINT b_pkey PRIMARY KEY (id)
  );

  ALTER TABLE ONLY public.b ADD CONSTRAINT b_a_fkey FOREIGN KEY (a_id) REFERENCES a(id);
