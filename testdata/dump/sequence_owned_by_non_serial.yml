# A sequence owned by a column that does not use it for its default is written
# with OWNED BY after the table.
init: |
  CREATE SEQUENCE public.my_seq;
  CREATE TABLE public.t (
      id integer,
      val integer DEFAULT 42
  );
  ALTER SEQUENCE public.my_seq OWNED BY public.t.val;
dump: |
  -- public.my_seq
  CREATE SEQUENCE public.my_seq
      AS bigint
      START WITH 1
      INCREMENT BY 1
      MINVALUE 1
      MAXVALUE 9223372036854775807
      CACHE 1;

  -- public.t
  CREATE TABLE public.t (
      id integer,
      val integer DEFAULT 42
  );

  ALTER SEQUENCE public.my_seq OWNED BY public.t.val;
