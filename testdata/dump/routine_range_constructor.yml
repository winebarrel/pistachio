# The constructors of a range type are part of the type, so dump does not write
# them.
manage_routine: true
init: |
  CREATE TYPE public.floatrange AS RANGE (subtype = double precision);
  CREATE TABLE public.t (
      id integer NOT NULL,
      r public.floatrange,
      CONSTRAINT t_pkey PRIMARY KEY (id)
  );
dump: |
  -- public.t
  CREATE TABLE public.t (
      id integer NOT NULL,
      r floatrange,
      CONSTRAINT t_pkey PRIMARY KEY (id)
  );
