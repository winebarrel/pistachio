# The filter leaves the parent out of the dump but not out of the database,
# where it holds the index, so the partition's copy is left out.
omit_partition_child_index: true
include: [logs_2025]
init: |
  CREATE TABLE public.logs (
      id integer NOT NULL,
      at date NOT NULL
  ) PARTITION BY RANGE (at);
  CREATE INDEX logs_at_idx ON public.logs USING btree (at);
  CREATE TABLE public.logs_2025 PARTITION OF public.logs FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');
dump: |
  -- public.logs_2025
  CREATE TABLE public.logs_2025 PARTITION OF public.logs FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');
