# A NOT VALID constraint goes out as its own ALTER DOMAIN, since CREATE DOMAIN
# cannot spell the clause and writing it inline would restore it validated.
init: |
  CREATE DOMAIN public.pos_int AS integer;
  ALTER DOMAIN public.pos_int ADD CONSTRAINT pos_check CHECK (VALUE > 0) NOT VALID;
  ALTER DOMAIN public.pos_int ADD CONSTRAINT pos_max CHECK (VALUE < 100);
dump: |
  -- public.pos_int
  CREATE DOMAIN public.pos_int AS integer
      CONSTRAINT pos_max CHECK ((VALUE < 100));
  ALTER DOMAIN public.pos_int ADD CONSTRAINT pos_check CHECK ((VALUE > 0)) NOT VALID;
