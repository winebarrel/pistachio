init: |
  CREATE TABLE public.parent (
      id integer NOT NULL,
      n integer,
      CONSTRAINT parent_n_check CHECK (n > 0)
  );
  CREATE TABLE public.child_empty () INHERITS (public.parent);
  CREATE TABLE public.child_merge (n integer NOT NULL) INHERITS (public.parent);
  CREATE TABLE public.child_own (extra text NOT NULL) INHERITS (public.parent);
  ALTER TABLE public.child_own ADD CONSTRAINT child_own_extra_check CHECK (extra <> '') NOT VALID;
dump: |
  -- public.child_empty
  CREATE TABLE public.child_empty (
  )
  INHERITS (public.parent);

  -- public.child_merge
  CREATE TABLE public.child_merge (
      n integer NOT NULL
  )
  INHERITS (public.parent);

  -- public.child_own
  CREATE TABLE public.child_own (
      extra text NOT NULL
  )
  INHERITS (public.parent);
  ALTER TABLE ONLY public.child_own ADD CONSTRAINT child_own_extra_check CHECK (extra <> ''::text) NOT VALID;

  -- public.parent
  CREATE TABLE public.parent (
      id integer NOT NULL,
      n integer,
      CONSTRAINT parent_n_check CHECK (n > 0)
  );
