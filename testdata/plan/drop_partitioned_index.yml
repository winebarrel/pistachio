# Dropping the parent's index drops the index attached to it on each partition,
# and PostgreSQL rejects a DROP of the attached one, so only the parent's is
# emitted.
init: |
  CREATE TABLE public.logs (
      id integer NOT NULL,
      at date NOT NULL
  ) PARTITION BY RANGE (at);
  CREATE TABLE public.logs_2025 PARTITION OF public.logs FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');
  CREATE INDEX logs_at_idx ON public.logs USING btree (at);
desired: |
  CREATE TABLE public.logs (
      id integer NOT NULL,
      at date NOT NULL
  ) PARTITION BY RANGE (at);
  CREATE TABLE public.logs_2025 PARTITION OF public.logs FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');
plan: |
  DROP INDEX public.logs_at_idx;
