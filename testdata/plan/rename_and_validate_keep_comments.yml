# RENAME, VALIDATE CONSTRAINT, ALTER CONSTRAINT, ALTER POLICY and CREATE OR
# REPLACE TRIGGER keep the object, and its comment with it.
init: |
  CREATE FUNCTION public.stamp() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE public.users (
      id integer NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  CREATE TABLE public.posts (
      id integer NOT NULL,
      user_id integer NOT NULL,
      CONSTRAINT posts_pkey PRIMARY KEY (id)
  );
  ALTER TABLE ONLY public.posts ADD CONSTRAINT posts_id_check CHECK (id > 0) NOT VALID;
  ALTER TABLE ONLY public.posts ADD CONSTRAINT posts_user_id_fkey FOREIGN KEY (user_id) REFERENCES public.users(id);
  CREATE POLICY posts_select ON public.posts FOR SELECT USING (true);
  CREATE TRIGGER posts_stamp BEFORE INSERT ON public.posts FOR EACH ROW EXECUTE FUNCTION public.stamp();
  COMMENT ON CONSTRAINT posts_pkey ON public.posts IS 'pk';
  COMMENT ON CONSTRAINT posts_id_check ON public.posts IS 'positive';
  COMMENT ON CONSTRAINT posts_user_id_fkey ON public.posts IS 'author';
  COMMENT ON POLICY posts_select ON public.posts IS 'everyone reads';
  COMMENT ON TRIGGER posts_stamp ON public.posts IS 'stamps';
desired: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  CREATE TABLE public.posts (
      id integer NOT NULL,
      user_id integer NOT NULL,
      -- pista:renamed-from posts_pkey
      CONSTRAINT posts_primary PRIMARY KEY (id),
      CONSTRAINT posts_id_check CHECK (id > 0)
  );
  ALTER TABLE ONLY public.posts ADD CONSTRAINT posts_user_id_fkey FOREIGN KEY (user_id) REFERENCES public.users(id) DEFERRABLE;
  -- pista:renamed-from posts_select
  CREATE POLICY posts_read ON public.posts FOR SELECT USING (id > 0);
  CREATE TRIGGER posts_stamp BEFORE UPDATE ON public.posts FOR EACH ROW EXECUTE FUNCTION public.stamp();
  COMMENT ON CONSTRAINT posts_primary ON public.posts IS 'pk';
  COMMENT ON CONSTRAINT posts_id_check ON public.posts IS 'positive';
  COMMENT ON CONSTRAINT posts_user_id_fkey ON public.posts IS 'author';
  COMMENT ON POLICY posts_read ON public.posts IS 'everyone reads';
  COMMENT ON TRIGGER posts_stamp ON public.posts IS 'stamps';
plan: |
  ALTER TABLE public.posts RENAME CONSTRAINT posts_pkey TO posts_primary;
  ALTER TABLE public.posts VALIDATE CONSTRAINT posts_id_check;
  ALTER POLICY posts_select ON public.posts RENAME TO posts_read;
  ALTER POLICY posts_read ON public.posts USING (id > 0);
  CREATE OR REPLACE TRIGGER posts_stamp BEFORE UPDATE ON public.posts FOR EACH ROW EXECUTE FUNCTION public.stamp();
  ALTER TABLE public.posts ALTER CONSTRAINT posts_user_id_fkey DEFERRABLE;
