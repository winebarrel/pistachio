# Without --allow-drop view nothing runs, so a dependent is no obstacle and
# the plan is the usual commented drop rather than an error.
drop_policy:
  allow_drop: []
exclude: [eng_staff]
init: |
  CREATE TABLE public.employees (id integer NOT NULL, name text, dept text);
  CREATE VIEW public.staff AS SELECT id, name, dept FROM public.employees;
  CREATE VIEW public.eng_staff AS SELECT id, name FROM public.staff WHERE dept = 'eng';
desired: |
  CREATE TABLE public.employees (id integer NOT NULL, name text, dept text);
plan: ""
disallowed_drops: |
  -- skipped: DROP VIEW public.staff;
