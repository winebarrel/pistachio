init: |
  CREATE FUNCTION public.redirect() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE public.items (id integer);
  CREATE VIEW public.items_v AS SELECT id FROM public.items;
  CREATE TRIGGER items_v_insert INSTEAD OF INSERT ON public.items_v FOR EACH ROW EXECUTE FUNCTION public.redirect();
