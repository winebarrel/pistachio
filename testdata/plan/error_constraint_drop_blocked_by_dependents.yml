# A foreign key depends on the index behind the key it references, and a view
# that groups by the key depends on the constraint. Either one blocks the DROP
# CONSTRAINT that a change to the key goes out as.
init: |
  CREATE TABLE public.t (a integer NOT NULL, b integer NOT NULL, CONSTRAINT t_pkey PRIMARY KEY (a));
  CREATE TABLE public.r (a integer, CONSTRAINT r_a_fkey FOREIGN KEY (a) REFERENCES public.t (a));
  CREATE VIEW public.v AS SELECT a, b FROM public.t GROUP BY a;
desired: |
  CREATE TABLE public.t (a integer NOT NULL, b integer NOT NULL, CONSTRAINT t_pkey PRIMARY KEY (a, b), CONSTRAINT t_a_key UNIQUE (a));
  CREATE TABLE public.r (a integer, CONSTRAINT r_a_fkey FOREIGN KEY (a) REFERENCES public.t (a));
  CREATE VIEW public.v AS SELECT a, b FROM public.t GROUP BY a, b;
error: "cannot drop constraint t_pkey on public.t: foreign key r_a_fkey on public.r, view public.v depend on it"
