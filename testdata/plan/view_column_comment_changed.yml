# A column comment on an existing view is added, changed and removed without
# touching the view.
init: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      name text NOT NULL,
      email text,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  CREATE VIEW public.active_users AS SELECT id, name, email FROM public.users;
  COMMENT ON COLUMN public.active_users.name IS 'Full name';
  COMMENT ON COLUMN public.active_users.email IS 'Email';
desired: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      name text NOT NULL,
      email text,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  CREATE VIEW public.active_users AS SELECT id, name, email FROM public.users;
  COMMENT ON COLUMN public.active_users.id IS 'User ID';
  COMMENT ON COLUMN public.active_users.name IS 'Display name';
plan: |
  COMMENT ON COLUMN public.active_users.id IS 'User ID';
  COMMENT ON COLUMN public.active_users.name IS 'Display name';
  COMMENT ON COLUMN public.active_users.email IS NULL;
