# The rewrite follows the rename only. An expression that also changes is
# still an error, since PostgreSQL cannot alter a generated expression in
# place.
init: |
  CREATE TABLE public.items (
      id integer NOT NULL,
      qty integer NOT NULL,
      total integer GENERATED ALWAYS AS (qty * 2) STORED,
      CONSTRAINT items_pkey PRIMARY KEY (id)
  );
desired: |
  CREATE TABLE public.items (
      id integer NOT NULL,
      -- pista:renamed-from qty
      quantity integer NOT NULL,
      total integer GENERATED ALWAYS AS (quantity * 3) STORED,
      CONSTRAINT items_pkey PRIMARY KEY (id)
  );
error: cannot change GENERATED expression
