# A constraint trigger whose WHEN condition alone changes. The condition is part
# of the definition, and a constraint trigger has no CREATE OR REPLACE, so the
# change runs as a drop and a create.
init: |
  CREATE FUNCTION public.check_invoice() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE public.invoices (
      invoice_no bigint NOT NULL,
      status text NOT NULL,
      amount numeric(12,2) NOT NULL,
      CONSTRAINT invoices_pkey PRIMARY KEY (invoice_no)
  );
  CREATE CONSTRAINT TRIGGER invoices_settled AFTER UPDATE ON public.invoices
      DEFERRABLE INITIALLY DEFERRED
      FOR EACH ROW WHEN (NEW.status IS DISTINCT FROM OLD.status)
      EXECUTE FUNCTION public.check_invoice();
desired: |
  CREATE TABLE public.invoices (
      invoice_no bigint NOT NULL,
      status text NOT NULL,
      amount numeric(12,2) NOT NULL,
      CONSTRAINT invoices_pkey PRIMARY KEY (invoice_no)
  );
  CREATE CONSTRAINT TRIGGER invoices_settled AFTER UPDATE ON public.invoices
      DEFERRABLE INITIALLY DEFERRED
      FOR EACH ROW WHEN (NEW.status IS DISTINCT FROM OLD.status OR NEW.amount <> OLD.amount)
      EXECUTE FUNCTION check_invoice();
drop_policy:
  allow_drop:
    - trigger
plan: |
  DROP TRIGGER invoices_settled ON public.invoices;
  CREATE CONSTRAINT TRIGGER invoices_settled AFTER UPDATE ON public.invoices DEFERRABLE INITIALLY DEFERRED FOR EACH ROW WHEN (new.status IS DISTINCT FROM old.status OR new.amount <> old.amount) EXECUTE FUNCTION check_invoice();
