# A view and a materialized view created with their parameters. The clause
# precedes AS, which is the only place CREATE takes it.
manage_storage_param: true
init: |
  CREATE TABLE public.items (
      id integer NOT NULL,
      status text NOT NULL,
      CONSTRAINT items_pkey PRIMARY KEY (id)
  );
desired: |
  CREATE TABLE public.items (
      id integer NOT NULL,
      status text NOT NULL,
      CONSTRAINT items_pkey PRIMARY KEY (id)
  );
  CREATE VIEW public.safe_items WITH (security_barrier = true, security_invoker = true) AS SELECT id, status FROM public.items WITH CHECK OPTION;
  CREATE MATERIALIZED VIEW public.item_stats WITH (fillfactor = 70, autovacuum_enabled = off) AS SELECT count(*) AS cnt FROM public.items;
plan: |
  CREATE MATERIALIZED VIEW public.item_stats WITH (autovacuum_enabled='off', fillfactor='70') AS
  SELECT count(*) AS cnt FROM public.items;
  CREATE OR REPLACE VIEW public.safe_items WITH (security_barrier='true', security_invoker='true') AS
  SELECT id, status FROM public.items
    WITH CASCADED CHECK OPTION;
