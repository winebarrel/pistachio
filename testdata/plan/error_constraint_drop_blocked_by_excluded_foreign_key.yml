# A foreign key on a table --exclude hides still blocks.
exclude: [r]
init: |
  CREATE TABLE public.t (a integer NOT NULL, b integer NOT NULL, CONSTRAINT t_pkey PRIMARY KEY (a));
  CREATE TABLE public.r (a integer, CONSTRAINT r_a_fkey FOREIGN KEY (a) REFERENCES public.t (a));
desired: |
  CREATE TABLE public.t (a integer NOT NULL, b integer NOT NULL, CONSTRAINT t_pkey PRIMARY KEY (a, b), CONSTRAINT t_a_key UNIQUE (a));
error: "cannot drop constraint t_pkey on public.t: foreign key r_a_fkey on public.r depends on it"
