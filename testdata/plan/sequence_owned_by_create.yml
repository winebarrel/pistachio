# An owned sequence is created before the table that uses it in a default,
# and gets its owner after the table exists.
init: ""
desired: |
  CREATE SEQUENCE public.custom_user_id_seq CACHE 10;
  CREATE TABLE public.users (
      id bigint DEFAULT nextval('custom_user_id_seq'::regclass) NOT NULL
  );
  ALTER SEQUENCE public.custom_user_id_seq OWNED BY public.users.id;
plan: |
  CREATE SEQUENCE public.custom_user_id_seq
      AS bigint
      START WITH 1
      INCREMENT BY 1
      MINVALUE 1
      MAXVALUE 9223372036854775807
      CACHE 10;
  CREATE TABLE public.users (
      id bigint DEFAULT nextval('custom_user_id_seq'::regclass) NOT NULL
  );
  ALTER SEQUENCE public.custom_user_id_seq OWNED BY public.users.id;
