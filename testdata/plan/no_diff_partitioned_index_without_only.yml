# An index on a partitioned table written without ONLY, and without the index
# PostgreSQL creates on each partition. The catalog writes the parent's with
# ONLY, and a partition's index attached to it is not dropped.
init: |
  CREATE TABLE public.logs (
      id integer NOT NULL,
      at date NOT NULL
  ) PARTITION BY RANGE (at);
  CREATE TABLE public.logs_2025 PARTITION OF public.logs FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');
  CREATE INDEX logs_at_idx ON public.logs USING btree (at);
