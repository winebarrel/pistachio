# A USING expression that only casts the column changes the rows as the types
# alone would: a longer varchar keeps them as they are.
explain: true
init: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      code character varying(50) NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  INSERT INTO public.users SELECT g, 'c' || g FROM generate_series(1, 3) g;
  ANALYZE public.users;
desired: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      -- pista:retype-using code::character varying(100)
      code character varying(100) NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
plan: |
  ALTER TABLE public.users ALTER COLUMN code SET DATA TYPE character varying(100) USING code::character varying(100);
