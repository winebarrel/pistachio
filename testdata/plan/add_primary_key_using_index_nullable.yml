# A primary key added USING INDEX over a nullable column marks the column NOT
# NULL first, as a key added with a column list does.
init: |
  CREATE TABLE public.t (id integer, name text);
  CREATE UNIQUE INDEX t_idx ON public.t (id);
desired: |
  CREATE TABLE public.t (id integer, name text);
  CREATE UNIQUE INDEX t_idx ON public.t (id);
  ALTER TABLE public.t ADD CONSTRAINT t_pkey PRIMARY KEY USING INDEX t_idx;
plan: |
  ALTER TABLE public.t ALTER COLUMN id SET NOT NULL;
  ALTER TABLE public.t ADD CONSTRAINT t_pkey PRIMARY KEY USING INDEX t_idx;
