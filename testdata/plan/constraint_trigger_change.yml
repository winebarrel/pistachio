# PostgreSQL has no CREATE OR REPLACE CONSTRAINT TRIGGER, so a constraint
# trigger whose definition changes goes through DROP and CREATE, gated by the
# trigger drop policy like any other trigger drop.
init: |
  CREATE FUNCTION public.stamp() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE FUNCTION public.stamp2() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE public.events (
      id integer NOT NULL,
      CONSTRAINT events_pkey PRIMARY KEY (id)
  );
  CREATE CONSTRAINT TRIGGER events_check AFTER INSERT ON public.events
      DEFERRABLE INITIALLY DEFERRED
      FOR EACH ROW EXECUTE FUNCTION public.stamp();
desired: |
  CREATE TABLE public.events (
      id integer NOT NULL,
      CONSTRAINT events_pkey PRIMARY KEY (id)
  );
  CREATE CONSTRAINT TRIGGER events_check AFTER INSERT ON public.events DEFERRABLE INITIALLY DEFERRED FOR EACH ROW EXECUTE FUNCTION stamp2();
drop_policy:
  allow_drop:
    - trigger
plan: |
  DROP TRIGGER events_check ON public.events;
  CREATE CONSTRAINT TRIGGER events_check AFTER INSERT ON public.events DEFERRABLE INITIALLY DEFERRED FOR EACH ROW EXECUTE FUNCTION stamp2();
