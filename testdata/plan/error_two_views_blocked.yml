# Two blocked views in one plan are both reported, so one run says everything
# that has to move rather than one view per run.
drop_policy:
  allow_drop: [all]
exclude: ["*_reader"]
init: |
  CREATE TABLE public.t (id integer, a text, b text);
  CREATE VIEW public.v1 AS SELECT id, a, b FROM public.t;
  CREATE VIEW public.v2 AS SELECT id, a, b FROM public.t;
  CREATE VIEW public.v1_reader AS SELECT id FROM public.v1;
  CREATE VIEW public.v2_reader AS SELECT id FROM public.v2;
desired: |
  CREATE TABLE public.t (id integer, a text, b text);
  CREATE VIEW public.v1 AS SELECT id, a FROM public.t;
  CREATE VIEW public.v2 AS SELECT id, a FROM public.t;
error: "cannot drop public.v1: view public.v1_reader depends on it; cannot drop public.v2: view public.v2_reader depends on it"
