# A change CREATE OR REPLACE cannot make recreates the routine, and PostgreSQL
# refuses the DROP while anything depends on it.
manage_routine: true
init: |
  CREATE FUNCTION public.f(a integer) RETURNS integer LANGUAGE sql IMMUTABLE AS $$SELECT a$$;
  CREATE FUNCTION public.trg() RETURNS trigger LANGUAGE plpgsql AS $$BEGIN RETURN NEW; END$$;
  CREATE DOMAIN public.d AS integer CONSTRAINT d_check CHECK (public.f(VALUE) > 0);
  CREATE TABLE public.t (
      a integer, b integer DEFAULT public.f(1), c integer,
      e integer GENERATED ALWAYS AS (public.f(c)) STORED,
      CONSTRAINT t_a_check CHECK (public.f(a) > 0)
  );
  CREATE INDEX t_c_idx ON public.t (public.f(c));
  CREATE VIEW public.v AS SELECT public.f(a) AS fa FROM public.t;
  CREATE MATERIALIZED VIEW public.mv AS SELECT public.f(1) AS x;
  CREATE FUNCTION public.g() RETURNS integer LANGUAGE sql BEGIN ATOMIC SELECT public.f(1); END;
  ALTER TABLE public.t ENABLE ROW LEVEL SECURITY;
  CREATE POLICY p ON public.t USING (public.f(a) > 0);
  CREATE TRIGGER tr BEFORE INSERT ON public.t FOR EACH ROW WHEN (public.f(new.a) > 0) EXECUTE FUNCTION public.trg();
