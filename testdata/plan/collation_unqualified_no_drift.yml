# leave it unqualified. The two name the same collation, so there is no diff.
init: |
  CREATE TABLE public.t (
      c text COLLATE "C"
  );
  CREATE DOMAIN public.d AS text COLLATE "C";
  CREATE TYPE public.ct AS (a text COLLATE "C");
