# What `dump` writes has to plan clean, and so does a definition that spells
# the default out: a column carries a strategy either way, so the diff resolves
# an unwritten one against the type's own rather than reading it as none.
init: |
  CREATE TABLE public.docs (
      id integer NOT NULL,
      body text STORAGE external,
      note text COMPRESSION pglz,
      title text,
      CONSTRAINT docs_pkey PRIMARY KEY (id)
  );
desired: |
  CREATE TABLE public.docs (
      id integer NOT NULL,
      body text,
      note text,
      title text STORAGE extended,
      CONSTRAINT docs_pkey PRIMARY KEY (id)
  );
  ALTER TABLE public.docs ALTER COLUMN body SET STORAGE EXTERNAL;
  ALTER TABLE public.docs ALTER COLUMN note SET COMPRESSION pglz;
plan: ""
