# A rename in the same plan runs first and keeps the view's dependency, so the
# type change is still refused. The message names the columns by their new
# names.
init: |
  CREATE TABLE public.t (id integer NOT NULL, n integer);
  CREATE VIEW public.v AS SELECT id, n FROM public.t;
desired: |
  -- pista:renamed-from public.t
  CREATE TABLE public.u (
      id integer NOT NULL,
      -- pista:renamed-from n
      m bigint
  );
  CREATE VIEW public.v AS SELECT id, m AS n FROM public.u;
error: "cannot change the type of public.u.m: view public.v depends on it"
