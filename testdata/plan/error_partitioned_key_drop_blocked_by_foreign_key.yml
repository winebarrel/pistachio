# A foreign key that references a partitioned table depends on the parent's
# key as well as on each partition's copy.
init: |
  CREATE TABLE public.p (a integer NOT NULL, b integer NOT NULL, CONSTRAINT p_pkey PRIMARY KEY (a)) PARTITION BY RANGE (a);
  CREATE TABLE public.p_1 PARTITION OF public.p FOR VALUES FROM (0) TO (100);
  CREATE TABLE public.r (a integer, CONSTRAINT r_a_fkey FOREIGN KEY (a) REFERENCES public.p (a));
desired: |
  CREATE TABLE public.p (a integer NOT NULL, b integer NOT NULL, CONSTRAINT p_pkey PRIMARY KEY (a, b), CONSTRAINT p_a_key UNIQUE (a)) PARTITION BY RANGE (a);
  CREATE TABLE public.p_1 PARTITION OF public.p FOR VALUES FROM (0) TO (100);
  CREATE TABLE public.r (a integer, CONSTRAINT r_a_fkey FOREIGN KEY (a) REFERENCES public.p (a));
error: "cannot drop constraint p_pkey on public.p: foreign key r_a_fkey on public.r depends on it"
