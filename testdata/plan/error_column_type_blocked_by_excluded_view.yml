# --exclude keeps the view out of the diff, but it still reads the column and
# still blocks the type change.
exclude: [v]
init: |
  CREATE TABLE public.t (id integer NOT NULL, n integer);
  CREATE VIEW public.v AS SELECT id, n FROM public.t;
desired: |
  CREATE TABLE public.t (id integer NOT NULL, n bigint);
error: "cannot change the type of public.t.n: view public.v depends on it"
