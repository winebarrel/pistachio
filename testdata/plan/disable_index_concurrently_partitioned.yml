# --disable-index-concurrently turns the directive off, so the index on a
# partitioned table is created without CONCURRENTLY and no error is raised.
disable_index_concurrently: true
init: |
  CREATE TABLE public.events (
      id integer NOT NULL,
      created_at timestamp with time zone NOT NULL
  ) PARTITION BY RANGE (created_at);
  CREATE TABLE public.events_2024 PARTITION OF public.events FOR VALUES FROM ('2024-01-01') TO ('2025-01-01');
desired: |
  CREATE TABLE public.events (
      id integer NOT NULL,
      created_at timestamp with time zone NOT NULL
  ) PARTITION BY RANGE (created_at);
  CREATE TABLE public.events_2024 PARTITION OF public.events FOR VALUES FROM ('2024-01-01') TO ('2025-01-01');
  -- pista:concurrently
  CREATE INDEX events_id_idx ON public.events (id);
plan: |
  CREATE INDEX events_id_idx ON public.events USING btree (id);
