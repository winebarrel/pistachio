# The rename runs first, so the USING expression names the column by its new
# name. The directives may come in either order, and a quoted name works.
init: |
  CREATE TABLE public.t (id integer, old_flag integer, "Code" text);
desired: |
  CREATE TABLE public.t (
      id integer,
      -- pista:renamed-from old_flag
      -- pista:retype-using flag <> 0
      flag boolean,
      -- pista:retype-using "Code"::integer
      "Code" integer
  );
plan: |
  ALTER TABLE public.t RENAME COLUMN old_flag TO flag;
  ALTER TABLE public.t ALTER COLUMN flag SET DATA TYPE boolean USING flag <> 0;
  ALTER TABLE public.t ALTER COLUMN "Code" SET DATA TYPE integer USING "Code"::integer;
