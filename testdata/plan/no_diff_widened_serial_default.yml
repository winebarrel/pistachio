# A serial column widened to bigint keeps its integer sequence. The desired
# schema that dump writes for it matches.
init: |
  CREATE TABLE public.t (
      id serial NOT NULL
  );
  ALTER TABLE public.t ALTER COLUMN id SET DATA TYPE bigint;
desired: |
  CREATE SEQUENCE public.t_id_seq
      AS integer
      START WITH 1
      INCREMENT BY 1
      MINVALUE 1
      MAXVALUE 2147483647
      CACHE 1;

  CREATE TABLE public.t (
      id bigint DEFAULT nextval('t_id_seq'::regclass) NOT NULL
  );

  ALTER SEQUENCE public.t_id_seq OWNED BY public.t.id;
plan: ""
