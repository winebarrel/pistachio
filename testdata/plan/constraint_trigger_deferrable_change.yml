# A change to a constraint trigger's deferral alone is a definition change:
# shipments_route flips INITIALLY DEFERRED to INITIALLY IMMEDIATE, and
# shipments_weight goes from DEFERRABLE to NOT DEFERRABLE. Neither can use
# CREATE OR REPLACE, so both run as a drop and a create.
init: |
  CREATE FUNCTION public.verify_shipment() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE public.shipments (
      shipment_id bigint NOT NULL,
      carrier text NOT NULL,
      CONSTRAINT shipments_pkey PRIMARY KEY (shipment_id)
  );
  CREATE CONSTRAINT TRIGGER shipments_route AFTER INSERT OR UPDATE ON public.shipments
      DEFERRABLE INITIALLY DEFERRED
      FOR EACH ROW EXECUTE FUNCTION public.verify_shipment();
  CREATE CONSTRAINT TRIGGER shipments_weight AFTER UPDATE ON public.shipments
      DEFERRABLE INITIALLY IMMEDIATE
      FOR EACH ROW EXECUTE FUNCTION public.verify_shipment();
desired: |
  CREATE TABLE public.shipments (
      shipment_id bigint NOT NULL,
      carrier text NOT NULL,
      CONSTRAINT shipments_pkey PRIMARY KEY (shipment_id)
  );
  CREATE CONSTRAINT TRIGGER shipments_route AFTER INSERT OR UPDATE ON public.shipments DEFERRABLE INITIALLY IMMEDIATE FOR EACH ROW EXECUTE FUNCTION verify_shipment();
  CREATE CONSTRAINT TRIGGER shipments_weight AFTER UPDATE ON public.shipments NOT DEFERRABLE INITIALLY IMMEDIATE FOR EACH ROW EXECUTE FUNCTION verify_shipment();
drop_policy:
  allow_drop:
    - trigger
plan: |
  DROP TRIGGER shipments_route ON public.shipments;
  DROP TRIGGER shipments_weight ON public.shipments;
  CREATE CONSTRAINT TRIGGER shipments_route AFTER INSERT OR UPDATE ON public.shipments DEFERRABLE FOR EACH ROW EXECUTE FUNCTION verify_shipment();
  CREATE CONSTRAINT TRIGGER shipments_weight AFTER UPDATE ON public.shipments FOR EACH ROW EXECUTE FUNCTION verify_shipment();
