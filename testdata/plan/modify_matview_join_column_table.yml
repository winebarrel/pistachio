# A materialized view over a join gets the same treatment as a view: moving a
# column from one joined table to the other must produce DDL.
init: |
  CREATE TABLE public.users (id integer, name text);
  CREATE TABLE public.orders (id integer, user_id integer);
  CREATE MATERIALIZED VIEW public.user_orders AS
  SELECT u.id, u.name FROM public.users u JOIN public.orders o ON o.user_id = u.id;
desired: |
  CREATE TABLE public.users (id integer, name text);
  CREATE TABLE public.orders (id integer, user_id integer);
  CREATE MATERIALIZED VIEW public.user_orders AS
  SELECT o.id, u.name FROM public.users u JOIN public.orders o ON o.user_id = u.id;
plan: |
  DROP MATERIALIZED VIEW public.user_orders;
  CREATE MATERIALIZED VIEW public.user_orders AS
  SELECT o.id, u.name FROM public.users u JOIN public.orders o ON o.user_id = u.id;
