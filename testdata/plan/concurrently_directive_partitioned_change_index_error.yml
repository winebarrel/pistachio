# A changed index is dropped and created again, and the drop is refused.
init: |
  CREATE TABLE public.events (
      id integer NOT NULL,
      created_at timestamp with time zone NOT NULL
  ) PARTITION BY RANGE (created_at);
  CREATE TABLE public.events_2024 PARTITION OF public.events FOR VALUES FROM ('2024-01-01') TO ('2025-01-01');
  CREATE INDEX events_id_idx ON public.events (id);
desired: |
  CREATE TABLE public.events (
      id integer NOT NULL,
      created_at timestamp with time zone NOT NULL
  ) PARTITION BY RANGE (created_at);
  CREATE TABLE public.events_2024 PARTITION OF public.events FOR VALUES FROM ('2024-01-01') TO ('2025-01-01');
  -- pista:concurrently
  CREATE INDEX events_id_idx ON public.events (id, created_at);
error: "index public.events_id_idx: CONCURRENTLY is not supported on partitioned table public.events"
