# The PostgreSQL 17 SQL/JSON query functions each return a different type when
# the RETURNING clause is left off, and pg_get_expr prints the one the server
# resolved. The clause is dropped from the current side where the desired side
# wrote none, so the written form and the stored form compare equal.
#
# One view per function, so a failure names the one that drifted. A view rather
# than a CHECK so nothing depends on these functions being immutable. This runs
# on 17 and later only.
min_pg: 17
init: |
  CREATE TABLE public.t (
      a jsonb
  );
  CREATE VIEW public.v_value AS SELECT JSON_VALUE(t.a, '$.x') AS c FROM public.t;
  CREATE VIEW public.v_query AS SELECT JSON_QUERY(t.a, '$.y') AS c FROM public.t;
  CREATE VIEW public.v_exists AS SELECT JSON_EXISTS(t.a, '$.z') AS c FROM public.t;
  CREATE VIEW public.v_scalar AS SELECT JSON_SCALAR(1) AS c FROM public.t;
  CREATE VIEW public.v_serialize AS SELECT JSON_SERIALIZE(t.a) AS c FROM public.t;
desired: |
  CREATE TABLE public.t (
      a jsonb
  );
  CREATE VIEW public.v_value AS SELECT JSON_VALUE(t.a, '$.x') AS c FROM public.t;
  CREATE VIEW public.v_query AS SELECT JSON_QUERY(t.a, '$.y') AS c FROM public.t;
  CREATE VIEW public.v_exists AS SELECT JSON_EXISTS(t.a, '$.z') AS c FROM public.t;
  CREATE VIEW public.v_scalar AS SELECT JSON_SCALAR(1) AS c FROM public.t;
  CREATE VIEW public.v_serialize AS SELECT JSON_SERIALIZE(t.a) AS c FROM public.t;
plan: ""
