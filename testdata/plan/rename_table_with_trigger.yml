# RENAME TO carries the table's triggers and policies with it, so the plan
# holds the rename alone.
init: |
  CREATE FUNCTION public.stamp() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE public.users (
      id integer NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  ALTER TABLE public.users ENABLE ROW LEVEL SECURITY;
  CREATE POLICY users_pos ON public.users USING (id > 0);
  CREATE TRIGGER users_stamp BEFORE INSERT ON public.users
      FOR EACH ROW EXECUTE FUNCTION public.stamp();
  CREATE TRIGGER users_off BEFORE UPDATE ON public.users
      FOR EACH ROW EXECUTE FUNCTION public.stamp();
  ALTER TABLE public.users DISABLE TRIGGER users_off;
desired: |
  -- pista:renamed-from public.users
  CREATE TABLE public.accounts (
      id integer NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  ALTER TABLE public.accounts ENABLE ROW LEVEL SECURITY;
  CREATE POLICY users_pos ON public.accounts USING (id > 0);
  CREATE TRIGGER users_stamp BEFORE INSERT ON accounts
      FOR EACH ROW EXECUTE FUNCTION stamp();
  CREATE TRIGGER users_off BEFORE UPDATE ON accounts
      FOR EACH ROW EXECUTE FUNCTION stamp();
  ALTER TABLE public.accounts DISABLE TRIGGER users_off;
plan: |
  ALTER TABLE public.users RENAME TO accounts;
