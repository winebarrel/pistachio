# ALTER SEQUENCE against a sequence the desired schema does not declare
# before it is an error, not a declaration and not a statement to drop.
init: |
  CREATE TABLE public.t (
      id integer,
      val integer DEFAULT 42
  );
desired: |
  CREATE TABLE public.t (
      id integer,
      val integer DEFAULT 42
  );
  ALTER SEQUENCE public.absent_seq OWNED BY public.t.val;
error: "ALTER SEQUENCE public.absent_seq: sequence public.absent_seq is not declared before it"
