# A size the server can no longer date is printed without the "as of" part:
# pg_class keeps reltuples, the statistics that hold the time of the last
# VACUUM and ANALYZE are reset separately.
explain: true
init: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      name text,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  INSERT INTO public.users SELECT g, 'n' FROM generate_series(1, 3) g;
  ANALYZE public.users;
  SELECT pg_catalog.pg_stat_reset_single_table_counters('public.users'::pg_catalog.regclass);
desired: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      name text NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
plan: |
  -- scan, blocks reads and writes: public.users (~3 rows, 8192 bytes)
  ALTER TABLE public.users ALTER COLUMN name SET NOT NULL;
