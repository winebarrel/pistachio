# A default the desired schema writes is compared with the one the column
# carries, so a different one is set. The sequence the column owned is not in
# the desired schema, so it is dropped once the default no longer draws from
# it.
init: |
  CREATE SEQUENCE public.custom_user_id_seq;
  CREATE TABLE public.users (
      id bigint DEFAULT nextval('custom_user_id_seq') NOT NULL
  );
  ALTER SEQUENCE public.custom_user_id_seq OWNED BY public.users.id;
desired: |
  CREATE TABLE public.users (
      id bigint DEFAULT 0 NOT NULL
  );
plan: |
  ALTER TABLE public.users ALTER COLUMN id SET DEFAULT 0;
  DROP SEQUENCE public.custom_user_id_seq;
