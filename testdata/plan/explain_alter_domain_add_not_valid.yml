# A constraint added NOT VALID reads no rows, so it gets no comment.
explain: true
init: |
  CREATE DOMAIN public.email AS text;
  CREATE TABLE public.users (
      id integer NOT NULL,
      email public.email,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  INSERT INTO public.users SELECT g, 'a@b' FROM generate_series(1, 3) g;
  ANALYZE public.users;
desired: |
  CREATE DOMAIN public.email AS text;
  ALTER DOMAIN public.email ADD CONSTRAINT email_check CHECK (VALUE ~ '@') NOT VALID;
  CREATE TABLE public.users (
      id integer NOT NULL,
      email public.email,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
plan: |
  ALTER DOMAIN public.email ADD CONSTRAINT email_check CHECK (value ~ '@') NOT VALID;
