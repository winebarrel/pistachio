# A generated column is compared through equalSelectExpr rather than
# equalConstraintDef or equalViewDef, so it reaches the SQL/JSON expressions by
# a third path. pg_get_expr prints the RETURNING clause the server resolved, so
# the file writes it too.
min_pg: 16
init: |
  CREATE TABLE public.t (
      a jsonb,
      obj jsonb GENERATED ALWAYS AS (JSON_OBJECT('k': a RETURNING jsonb)) STORED,
      arr jsonb GENERATED ALWAYS AS (JSON_ARRAY(a RETURNING jsonb)) STORED
  );
desired: |
  CREATE TABLE public.t (
      a jsonb,
      obj jsonb GENERATED ALWAYS AS (JSON_OBJECT('k': a RETURNING jsonb)) STORED,
      arr jsonb GENERATED ALWAYS AS (JSON_ARRAY(a RETURNING jsonb)) STORED
  );
plan: ""
