# The catalog writes a parameter default with its type, so 'x' reads back as
# 'x'::text. A default written without the cast is the same default.
manage_routine: true
init: |
  CREATE FUNCTION public.fd(a text DEFAULT 'x', b integer DEFAULT NULL, c integer[] DEFAULT '{}') RETURNS text
      LANGUAGE sql
      AS $$ SELECT a $$;
desired: |
  CREATE FUNCTION public.fd(a text DEFAULT 'x', b integer DEFAULT NULL, c integer[] DEFAULT '{}') RETURNS text
      LANGUAGE sql
      AS $$ SELECT a $$;
plan: ""
