evaluate_literals: true
init: |
  CREATE DOMAIN public.dur AS interval DEFAULT '1 hour' CONSTRAINT dur_check CHECK (VALUE > '30 minutes');
  CREATE DOMAIN public.old_dur AS interval DEFAULT '1 hour';
  CREATE TABLE public.t (
      id integer NOT NULL,
      iv interval DEFAULT '1 hour',
      old interval DEFAULT '1 hour',
      CONSTRAINT t_pkey PRIMARY KEY (id),
      CONSTRAINT t_iv_check CHECK (iv < '1 hour'),
      CONSTRAINT t_iv_range CHECK (iv > '-1 hours' AND iv < '1 day')
