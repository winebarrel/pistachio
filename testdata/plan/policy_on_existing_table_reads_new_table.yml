# A new policy on an existing table can read a table the same run creates.
init: |
  CREATE TABLE public.a_docs (tenant_id text);
  ALTER TABLE public.a_docs ENABLE ROW LEVEL SECURITY;
  CREATE POLICY p ON public.a_docs FOR SELECT USING (true);
desired: |
  CREATE TABLE public.a_docs (tenant_id text);
  ALTER TABLE public.a_docs ENABLE ROW LEVEL SECURITY;
  CREATE POLICY p ON public.a_docs FOR SELECT USING (true);
  CREATE POLICY q ON public.a_docs FOR INSERT WITH CHECK (tenant_id IN (SELECT z_tenants.id FROM z_tenants));
  CREATE TABLE public.z_tenants (id text);
plan: |
  CREATE TABLE public.z_tenants (
      id text
  );
  CREATE POLICY q ON public.a_docs FOR INSERT WITH CHECK (tenant_id IN (SELECT z_tenants.id FROM z_tenants));
