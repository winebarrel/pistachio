# A USING expression that computes new values rewrites the table, even when
# the types alone would keep the rows as they are.
explain: true
init: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      code character varying(50) NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  INSERT INTO public.users SELECT g, 'c' || g FROM generate_series(1, 3) g;
  ANALYZE public.users;
desired: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      -- pista:retype-using upper(code)
      code character varying(100) NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
plan: |
  -- rewrite, blocks reads and writes: public.users (~3 rows, 8192 bytes, as of {{today}}, 1 index rebuilt)
  ALTER TABLE public.users ALTER COLUMN code SET DATA TYPE character varying(100) USING upper(code);
