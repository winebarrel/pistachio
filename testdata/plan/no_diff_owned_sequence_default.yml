# A column whose default draws from a sequence it owns, under a name serial
# would not give it, reads back with its own type and default, and the
# sequence reads back with its owner. Both match the desired schema.
init: |
  CREATE SEQUENCE public.custom_user_id_seq;
  CREATE TABLE public.users (
      id bigint DEFAULT nextval('custom_user_id_seq') NOT NULL,
      name text NOT NULL
  );
  ALTER SEQUENCE public.custom_user_id_seq OWNED BY public.users.id;
desired: |
  CREATE SEQUENCE public.custom_user_id_seq;
  CREATE TABLE public.users (
      id bigint DEFAULT nextval('custom_user_id_seq') NOT NULL,
      name text NOT NULL
  );
