# A column that takes its default from an owned sequence with a custom name
# is read back with its type and default, and the sequence with its owner.
# Both match the desired schema.
init: |
  CREATE SEQUENCE public.custom_user_id_seq;
  CREATE TABLE public.users (
      id bigint DEFAULT nextval('custom_user_id_seq') NOT NULL,
      name text NOT NULL
  );
  ALTER SEQUENCE public.custom_user_id_seq OWNED BY public.users.id;
desired: |
