explain: true
init: |
  CREATE DOMAIN public.email AS text
      CONSTRAINT email_check CHECK (VALUE ~ '@');
  CREATE DOMAIN public.unused AS integer;
  CREATE TABLE public.users (
      id integer NOT NULL,
      email public.email,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  INSERT INTO public.users SELECT g, 'a@b' FROM generate_series(1, 3) g;
  ANALYZE public.users;
desired: |
  CREATE DOMAIN public.email AS text DEFAULT 'a@b'::text;
  CREATE DOMAIN public.unused AS integer
      CONSTRAINT unused_positive CHECK (VALUE > 0);
  CREATE TABLE public.users (
      id integer NOT NULL,
      email public.email,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
plan: |
  ALTER DOMAIN public.email SET DEFAULT 'a@b'::text;
  ALTER DOMAIN public.email DROP CONSTRAINT email_check;
  ALTER DOMAIN public.unused ADD CONSTRAINT unused_positive CHECK (value > 0);
