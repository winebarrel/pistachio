# The rename target is the name the index would be given, so an unnamed index
# can be renamed onto like any other.
init: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      name text NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  CREATE INDEX idx_users_name ON public.users (name);
desired: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      name text NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  -- pista:renamed-from idx_users_name
  CREATE INDEX ON public.users (name);
plan: |
  ALTER INDEX public.idx_users_name RENAME TO users_name_idx;
