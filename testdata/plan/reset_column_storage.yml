# Dropping the settings from the desired schema asks for the defaults back.
# Storage has no "unset" state in the catalog, so the type's own strategy is
# named; PostgreSQL 15 has no SET STORAGE DEFAULT to name instead.
init: |
  CREATE TABLE public.docs (
      id integer NOT NULL,
      body text STORAGE external,
      note text COMPRESSION pglz,
      CONSTRAINT docs_pkey PRIMARY KEY (id)
  );
desired: |
  CREATE TABLE public.docs (
      id integer NOT NULL,
      body text,
      note text,
      CONSTRAINT docs_pkey PRIMARY KEY (id)
  );
plan: |
  ALTER TABLE public.docs ALTER COLUMN body SET STORAGE EXTENDED;
  ALTER TABLE public.docs ALTER COLUMN note SET COMPRESSION default;
