# A column that draws from a sequence it owns keeps its default when the
# desired schema writes none, the way a serial column does. The sequence stays
# with it, so nothing is dropped. A dump made before pistachio wrote such a
# default left it out.
init: |
  CREATE SEQUENCE public.custom_user_id_seq;
  CREATE TABLE public.users (
      id bigint DEFAULT nextval('custom_user_id_seq') NOT NULL
  );
  ALTER SEQUENCE public.custom_user_id_seq OWNED BY public.users.id;
desired: |
  CREATE TABLE public.users (
      id bigint NOT NULL
  );
plan: ""
