# A column that takes its default from an owned sequence keeps the default
# when the desired schema has none, as a serial column does. The sequence
# stays too, so nothing changes. Dumps from earlier versions left out such a
# default.
init: |
  CREATE SEQUENCE public.custom_user_id_seq;
  CREATE TABLE public.users (
      id bigint DEFAULT nextval('custom_user_id_seq') NOT NULL
  );
  ALTER SEQUENCE public.custom_user_id_seq OWNED BY public.users.id;
desired: |
  CREATE TABLE public.users (
      id bigint NOT NULL
  );
plan: ""
