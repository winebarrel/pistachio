# The filter leaves out the parent, so the child's columns come from the
# catalog. The catalog writes the collation as pg_catalog."C".
include: [events_0]
init: |
  CREATE TABLE public.events (
      name text COLLATE "C",
      k integer
  )
  PARTITION BY RANGE (k);
  CREATE TABLE public.events_0 PARTITION OF public.events FOR VALUES FROM (0) TO (10);
  CREATE INDEX events_0_name_idx ON public.events_0 USING btree (name COLLATE "C");
desired: |
  CREATE TABLE public.events (
      name text COLLATE "C",
      k integer
  )
  PARTITION BY RANGE (k);
  CREATE TABLE public.events_0 PARTITION OF public.events FOR VALUES FROM (0) TO (10);
  CREATE INDEX events_0_name_idx ON public.events_0 USING btree (name COLLATE "C");
