# A key on a table renamed in the same plan is looked up under the old table
# name. The foreign key sits on an excluded table, so the plan keeps it.
exclude: [r]
init: |
  CREATE TABLE public.t (a integer NOT NULL, b integer NOT NULL, CONSTRAINT t_pkey PRIMARY KEY (a));
  CREATE TABLE public.r (a integer, CONSTRAINT r_a_fkey FOREIGN KEY (a) REFERENCES public.t (a));
desired: |
  -- pista:renamed-from public.t
  CREATE TABLE public.u (a integer NOT NULL, b integer NOT NULL, CONSTRAINT t_pkey PRIMARY KEY (a, b), CONSTRAINT u_a_key UNIQUE (a));
error: "cannot drop constraint t_pkey on public.u: foreign key r_a_fkey on public.r depends on it"
