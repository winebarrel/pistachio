# A foreign key without referenced columns takes the primary key of the table
# it names. That table may come later, sit in another schema, get its primary
# key from ALTER TABLE or USING INDEX, or be the key's own table. A bare name
# not in the default schema is looked up in the key's own schema. A key to a
# table the schema does not declare, or whose primary key columns are not
# known, is left as written.
input: |
  CREATE TABLE public.posts (
      id integer NOT NULL,
      parent_id integer REFERENCES posts,
      user_id integer REFERENCES users,
      tag_id integer REFERENCES tags,
      code text REFERENCES codes,
      idx_id integer REFERENCES by_index,
      ext_id integer REFERENCES by_ext_index,
      a integer,
      b integer,
      CONSTRAINT posts_pkey PRIMARY KEY (id)
  );
  ALTER TABLE public.posts ADD CONSTRAINT posts_pair_fkey FOREIGN KEY (a, b) REFERENCES app."Pair" ON DELETE CASCADE;
  CREATE TABLE public.users (
      id integer NOT NULL
  );
  ALTER TABLE public.users ADD CONSTRAINT users_pkey PRIMARY KEY (id);
  CREATE TABLE public.codes (
      code text NOT NULL,
      CONSTRAINT codes_code_key UNIQUE (code)
  );
  CREATE TABLE app."Pair" (
      "A" integer NOT NULL,
      b integer NOT NULL,
      PRIMARY KEY ("A", b)
  );
  CREATE TABLE public.by_index (
      id integer NOT NULL
  );
  CREATE UNIQUE INDEX by_index_id_idx ON public.by_index (id);
  ALTER TABLE public.by_index ADD CONSTRAINT by_index_pkey PRIMARY KEY USING INDEX by_index_id_idx;
  CREATE TABLE public.by_ext_index (
      id integer NOT NULL
  );
  ALTER TABLE public.by_ext_index ADD CONSTRAINT by_ext_index_pkey PRIMARY KEY USING INDEX by_ext_index_id_idx;
  CREATE TABLE app.base (
      id integer PRIMARY KEY
  );
  CREATE TABLE app.item (
      id integer PRIMARY KEY,
      base_id integer REFERENCES base
  );
expected: |
  -- public.posts
  CREATE TABLE public.posts (
      id integer NOT NULL,
      parent_id integer,
      user_id integer,
      tag_id integer,
      code text,
      idx_id integer,
      ext_id integer,
      a integer,
      b integer,
      CONSTRAINT posts_pkey PRIMARY KEY (id)
  );

  ALTER TABLE ONLY public.posts ADD CONSTRAINT posts_parent_id_fkey FOREIGN KEY (parent_id) REFERENCES posts (id);
  ALTER TABLE ONLY public.posts ADD CONSTRAINT posts_user_id_fkey FOREIGN KEY (user_id) REFERENCES users (id);
  ALTER TABLE ONLY public.posts ADD CONSTRAINT posts_tag_id_fkey FOREIGN KEY (tag_id) REFERENCES tags;
  ALTER TABLE ONLY public.posts ADD CONSTRAINT posts_code_fkey FOREIGN KEY (code) REFERENCES codes;
  ALTER TABLE ONLY public.posts ADD CONSTRAINT posts_idx_id_fkey FOREIGN KEY (idx_id) REFERENCES by_index (id);
  ALTER TABLE ONLY public.posts ADD CONSTRAINT posts_ext_id_fkey FOREIGN KEY (ext_id) REFERENCES by_ext_index;
  ALTER TABLE ONLY public.posts ADD CONSTRAINT posts_pair_fkey FOREIGN KEY (a, b) REFERENCES app."Pair" ("A", b) ON DELETE CASCADE;

  -- public.users
  CREATE TABLE public.users (
      id integer NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );

  -- public.codes
  CREATE TABLE public.codes (
      code text NOT NULL,
      CONSTRAINT codes_code_key UNIQUE (code)
  );

  -- app."Pair"
  CREATE TABLE app."Pair" (
      "A" integer NOT NULL,
      b integer NOT NULL,
      CONSTRAINT "Pair_pkey" PRIMARY KEY ("A", b)
  );

  -- public.by_index
  CREATE TABLE public.by_index (
      id integer NOT NULL,
      CONSTRAINT by_index_pkey PRIMARY KEY USING INDEX by_index_id_idx
  );
  CREATE UNIQUE INDEX by_index_id_idx ON public.by_index USING btree (id);

  -- public.by_ext_index
  CREATE TABLE public.by_ext_index (
      id integer NOT NULL,
      CONSTRAINT by_ext_index_pkey PRIMARY KEY USING INDEX by_ext_index_id_idx
  );

  -- app.base
  CREATE TABLE app.base (
      id integer NOT NULL,
      CONSTRAINT base_pkey PRIMARY KEY (id)
  );

  -- app.item
  CREATE TABLE app.item (
      id integer NOT NULL,
      base_id integer,
      CONSTRAINT item_pkey PRIMARY KEY (id)
  );

  ALTER TABLE ONLY app.item ADD CONSTRAINT item_base_id_fkey FOREIGN KEY (base_id) REFERENCES base (id);
