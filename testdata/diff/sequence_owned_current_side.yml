# A CREATE SEQUENCE ... OWNED BY in the current file is a managed sequence, so
# leaving it out of the desired file drops it.
current: |
  CREATE TABLE public.t (
      id integer NOT NULL
  );
  CREATE SEQUENCE public.s OWNED BY public.t.id;
desired: |
  CREATE TABLE public.t (
      id integer NOT NULL
  );
diff: |
  DROP SEQUENCE public.s;
count:
  sequences: 1
