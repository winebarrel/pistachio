# --skip-partition-child compares the parent without its partitions: a
# partition only one side declares is neither created nor dropped.
skip_partition_child: true
current: |
  CREATE TABLE public.events (
      id integer NOT NULL,
      at date NOT NULL
  ) PARTITION BY RANGE (at);
  CREATE TABLE public.events_2025 PARTITION OF public.events FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');
desired: |
  CREATE TABLE public.events (
      id integer NOT NULL,
      at date NOT NULL,
      note text
  ) PARTITION BY RANGE (at);
  CREATE TABLE public.events_2026 PARTITION OF public.events FOR VALUES FROM ('2026-01-01') TO ('2027-01-01');
diff: |
  ALTER TABLE public.events ADD COLUMN note text;
