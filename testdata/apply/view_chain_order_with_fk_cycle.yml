# The plan fixture of the same name pins the statement order; this one runs it
# against the database, which is what says the order is one PostgreSQL accepts.
# Without the view sort in fallbackOrder the apply fails on the first DROP.
#
# PostgreSQL 15 qualifies a view's column references with the relation, 16 and
# later do not, so the dump is written per version.
allow_drop: [all]
init: |
  CREATE TABLE public.invoices (id integer NOT NULL, shipment_id integer, CONSTRAINT invoices_pkey PRIMARY KEY (id));
  CREATE TABLE public.shipments (id integer NOT NULL, invoice_id integer, CONSTRAINT shipments_pkey PRIMARY KEY (id));
  ALTER TABLE public.invoices ADD CONSTRAINT invoices_shipment_fk FOREIGN KEY (shipment_id) REFERENCES public.shipments(id);
  ALTER TABLE public.shipments ADD CONSTRAINT shipments_invoice_fk FOREIGN KEY (invoice_id) REFERENCES public.invoices(id);
  CREATE TABLE public.employees (id integer NOT NULL, name text, dept text, salary integer);
  CREATE VIEW public.a_base AS SELECT id, name, dept, salary FROM public.employees;
  CREATE VIEW public.b_top AS SELECT id, name, salary FROM public.a_base;
desired: |
  CREATE TABLE public.invoices (id integer NOT NULL, shipment_id integer, CONSTRAINT invoices_pkey PRIMARY KEY (id));
  CREATE TABLE public.shipments (id integer NOT NULL, invoice_id integer, CONSTRAINT shipments_pkey PRIMARY KEY (id));
  ALTER TABLE public.invoices ADD CONSTRAINT invoices_shipment_fk FOREIGN KEY (shipment_id) REFERENCES public.shipments(id);
  ALTER TABLE public.shipments ADD CONSTRAINT shipments_invoice_fk FOREIGN KEY (invoice_id) REFERENCES public.invoices(id);
  CREATE TABLE public.employees (id integer NOT NULL, name text, dept text, salary integer);
  CREATE VIEW public.a_base AS SELECT id, name, dept FROM public.employees;
  CREATE VIEW public.b_top AS SELECT id, name FROM public.a_base;
applied: |
  -- public.employees
  CREATE TABLE public.employees (
      id integer NOT NULL,
      name text,
      dept text,
      salary integer
  );

  -- public.invoices
  CREATE TABLE public.invoices (
      id integer NOT NULL,
      shipment_id integer,
      CONSTRAINT invoices_pkey PRIMARY KEY (id)
  );

  ALTER TABLE ONLY public.invoices ADD CONSTRAINT invoices_shipment_fk FOREIGN KEY (shipment_id) REFERENCES shipments(id);

  -- public.shipments
  CREATE TABLE public.shipments (
      id integer NOT NULL,
      invoice_id integer,
      CONSTRAINT shipments_pkey PRIMARY KEY (id)
  );

  ALTER TABLE ONLY public.shipments ADD CONSTRAINT shipments_invoice_fk FOREIGN KEY (invoice_id) REFERENCES invoices(id);

  -- public.a_base
  CREATE OR REPLACE VIEW public.a_base AS
  SELECT employees.id,
      employees.name,
      employees.dept
     FROM employees;

  -- public.b_top
  CREATE OR REPLACE VIEW public.b_top AS
  SELECT a_base.id,
      a_base.name
     FROM a_base;
applied_pg16: &applied_pg16plus |
