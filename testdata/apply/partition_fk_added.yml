# ONLY is rejected on a partitioned table, so the key is added without it.
init: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  CREATE TABLE public.orders (
      id integer NOT NULL,
      at date NOT NULL,
      user_id integer,
      CONSTRAINT orders_pkey PRIMARY KEY (id, at)
  ) PARTITION BY RANGE (at);
  CREATE TABLE public.orders_2025 PARTITION OF public.orders FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');
desired: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  CREATE TABLE public.orders (
      id integer NOT NULL,
      at date NOT NULL,
      user_id integer,
      CONSTRAINT orders_pkey PRIMARY KEY (id, at),
      CONSTRAINT fk_user FOREIGN KEY (user_id) REFERENCES public.users(id)
  ) PARTITION BY RANGE (at);
  CREATE TABLE public.orders_2025 PARTITION OF public.orders FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');
applied_sql: |
  ALTER TABLE public.orders ADD CONSTRAINT fk_user FOREIGN KEY (user_id) REFERENCES public.users (id);
applied: |
  -- public.orders
  CREATE TABLE public.orders (
      id integer NOT NULL,
      at date NOT NULL,
      user_id integer,
      CONSTRAINT orders_pkey PRIMARY KEY (id, at)
  )
  PARTITION BY RANGE (at);

  ALTER TABLE public.orders ADD CONSTRAINT fk_user FOREIGN KEY (user_id) REFERENCES users(id);

  -- public.orders_2025
  CREATE TABLE public.orders_2025 PARTITION OF public.orders FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');

  -- public.users
  CREATE TABLE public.users (
      id integer NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
