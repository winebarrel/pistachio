# A constraint trigger changing only its deferral. The drop and the create
# leave the new deferral in the catalog, and the re-plan finds no drift.
init: |
  CREATE FUNCTION public.verify_shipment() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE public.shipments (shipment_id bigint NOT NULL, carrier text NOT NULL);
  CREATE CONSTRAINT TRIGGER shipments_route AFTER INSERT OR UPDATE ON public.shipments DEFERRABLE INITIALLY DEFERRED FOR EACH ROW EXECUTE FUNCTION public.verify_shipment();
desired: |
  CREATE TABLE public.shipments (shipment_id bigint NOT NULL, carrier text NOT NULL);
  CREATE CONSTRAINT TRIGGER shipments_route AFTER INSERT OR UPDATE ON public.shipments NOT DEFERRABLE INITIALLY IMMEDIATE FOR EACH ROW EXECUTE FUNCTION verify_shipment();
drop_policy:
  allow_drop:
    - trigger
applied: |
  -- public.shipments
  CREATE TABLE public.shipments (
      shipment_id bigint NOT NULL,
      carrier text NOT NULL
  );

  CREATE CONSTRAINT TRIGGER shipments_route AFTER INSERT OR UPDATE ON shipments NOT DEFERRABLE INITIALLY IMMEDIATE FOR EACH ROW EXECUTE FUNCTION verify_shipment();
