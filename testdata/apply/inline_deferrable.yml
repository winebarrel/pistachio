init: ""
desired: |
  CREATE TABLE public.users (
      id integer PRIMARY KEY,
      code text UNIQUE DEFERRABLE
  );
  CREATE TABLE public.posts (
      id integer PRIMARY KEY,
      user_id integer REFERENCES public.users (id) DEFERRABLE INITIALLY DEFERRED
  );
applied: |
  -- public.posts
  CREATE TABLE public.posts (
      id integer NOT NULL,
      user_id integer,
      CONSTRAINT posts_pkey PRIMARY KEY (id)
  );

  ALTER TABLE ONLY public.posts ADD CONSTRAINT posts_user_id_fkey FOREIGN KEY (user_id) REFERENCES users(id) DEFERRABLE INITIALLY DEFERRED;

  -- public.users
  CREATE TABLE public.users (
      id integer NOT NULL,
      code text,
      CONSTRAINT users_pkey PRIMARY KEY (id),
      CONSTRAINT users_code_key UNIQUE (code) DEFERRABLE
  );
