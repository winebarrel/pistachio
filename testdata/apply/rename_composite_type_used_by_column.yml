init: |
  CREATE TYPE public.address AS (street text, city text);
  CREATE TYPE public.contact AS (home public.address, others public.address[]);
  CREATE TABLE public.users (
      id integer NOT NULL,
      addr public.address,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  CREATE VIEW public.user_addrs AS SELECT id, addr FROM public.users;
desired: |
