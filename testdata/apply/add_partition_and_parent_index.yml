# The parent's index is new in this plan, so a new partition gets no copy of
# it. The partition's index is created, and the parent's index attaches it.
init: |
  CREATE TABLE public.logs (
      id integer NOT NULL,
      at date NOT NULL
  ) PARTITION BY RANGE (at);
desired: |
  CREATE TABLE public.logs (
      id integer NOT NULL,
      at date NOT NULL
  )
  PARTITION BY RANGE (at);
  CREATE INDEX logs_at_idx ON public.logs USING btree (at);

  CREATE TABLE public.logs_2026 PARTITION OF public.logs FOR VALUES FROM ('2026-01-01') TO ('2027-01-01');
  CREATE INDEX logs_2026_at_idx ON public.logs_2026 USING btree (at);
applied: |
