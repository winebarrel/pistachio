# The rename stands and the deferral clause is settled under the new name.
init: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  CREATE TABLE public.orders (
      id integer NOT NULL,
      user_id integer,
      CONSTRAINT orders_pkey PRIMARY KEY (id),
      CONSTRAINT fk_user FOREIGN KEY (user_id) REFERENCES public.users(id)
  );
desired: |
  CREATE TABLE public.users (
      id integer NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  CREATE TABLE public.orders (
      id integer NOT NULL,
      user_id integer,
      CONSTRAINT orders_pkey PRIMARY KEY (id),
      -- pista:renamed-from fk_user
      CONSTRAINT orders_user_id_fkey FOREIGN KEY (user_id) REFERENCES public.users(id) DEFERRABLE INITIALLY DEFERRED
  );
applied: |
  -- public.orders
  CREATE TABLE public.orders (
      id integer NOT NULL,
      user_id integer,
      CONSTRAINT orders_pkey PRIMARY KEY (id)
  );

  ALTER TABLE ONLY public.orders ADD CONSTRAINT orders_user_id_fkey FOREIGN KEY (user_id) REFERENCES users(id) DEFERRABLE INITIALLY DEFERRED;

  -- public.users
  CREATE TABLE public.users (
      id integer NOT NULL,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
