# A renamed composite attribute's comment is looked up by its new name after
# the rename map is applied, mirroring rename_column_keeps_comment.yml for
# table columns: the comment attaches to the renamed attribute rather than
# being dropped and reapplied.
init: |
  CREATE TYPE public.address AS (
      street text,
      city text
  );
  COMMENT ON COLUMN public.address.street IS 'street line';
desired: |
  CREATE TYPE public.address AS (
      -- pista:renamed-from street
      road text,
      city text
  );
  COMMENT ON COLUMN public.address.road IS 'street line';
applied_sql: |
  ALTER TYPE public.address RENAME ATTRIBUTE street TO road;
applied: |
  -- public.address
  CREATE TYPE public.address AS (
      road text,
      city text
  );
  COMMENT ON COLUMN public.address.road IS 'street line';
