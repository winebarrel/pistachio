init: |
  CREATE TYPE public.status AS ENUM ('active', 'inactive');
  CREATE DOMAIN public.positive_int AS integer CONSTRAINT pos_check CHECK (VALUE > 0);
  CREATE TYPE public.address AS (street text, city text);
  CREATE SEQUENCE public.user_seq;
  CREATE TABLE public.users (
      id integer DEFAULT nextval('user_seq'::regclass) NOT NULL,
      status public.status,
      score public.positive_int,
      addr public.address,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  CREATE VIEW public.user_summary AS SELECT id, status, score, addr FROM public.users;
