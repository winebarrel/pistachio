  CREATE TYPE public.postal_address AS (
      street text,
      city text
  );

  -- public.user_id_seq
  CREATE SEQUENCE public.user_id_seq
      AS bigint
      START WITH 1
      INCREMENT BY 1
      MINVALUE 1
      MAXVALUE 9223372036854775807
      CACHE 1;

  -- public.users
  CREATE TABLE public.users (
      id integer DEFAULT nextval('user_id_seq'::regclass) NOT NULL,
      status user_status,
      score pos_int,
      addr postal_address,
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );

  -- public.user_summary
  CREATE OR REPLACE VIEW public.user_summary AS
  SELECT users.id,
      users.status,
      users.score,
      users.addr
     FROM users;
