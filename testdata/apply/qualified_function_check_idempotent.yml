  CREATE OR REPLACE FUNCTION public.lower_v(t text) RETURNS text AS $$ SELECT lower(t) $$ LANGUAGE sql IMMUTABLE;
  CREATE TABLE public.users (
      id integer NOT NULL,
      v text,
      CONSTRAINT users_pkey PRIMARY KEY (id),
      CONSTRAINT users_v_check CHECK (public.lower_v(v) <> 'x')
  );
  CREATE INDEX users_expr_idx ON public.users USING btree (public.lower_v(v));
