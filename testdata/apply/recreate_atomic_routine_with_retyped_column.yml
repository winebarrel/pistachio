# A recreated routine with a SQL-standard body does not block the type change
# of a column its old body reads, since it is dropped first.
manage_routine: true
init: |
  CREATE TABLE public.t (a integer);
  CREATE FUNCTION public.f() RETURNS integer LANGUAGE sql BEGIN ATOMIC SELECT max(t.a) AS max FROM t; END;
desired: |
  CREATE TABLE public.t (a bigint);
  CREATE FUNCTION public.f() RETURNS bigint LANGUAGE sql BEGIN ATOMIC SELECT max(t.a) AS max FROM t; END;
applied: |
  -- public.t
  CREATE TABLE public.t (
      a bigint
  );

  -- public.f()
  CREATE OR REPLACE FUNCTION public.f()
      RETURNS bigint
      LANGUAGE sql
      BEGIN ATOMIC
          SELECT max(t.a) AS max FROM t;
      END;
applied_sql: |
  DROP FUNCTION public.f();
  ALTER TABLE public.t ALTER COLUMN a SET DATA TYPE bigint;
  CREATE OR REPLACE FUNCTION public.f()
      RETURNS bigint
      LANGUAGE sql
      BEGIN ATOMIC
          SELECT max(t.a) AS max FROM t;
      END;
