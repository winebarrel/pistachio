  -- public.user_status
  CREATE TYPE public.user_status AS ENUM (
      'active',
      'inactive'
  );

  -- public.status_domain
  CREATE DOMAIN public.status_domain AS user_status;

  -- public.status_pair
  CREATE TYPE public.status_pair AS (
      current user_status,
      history user_status[]
  );

  -- public.users
  CREATE TABLE public.users (
      id integer NOT NULL,
      status user_status,
      history user_status[],
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );

  -- public.active_users
  CREATE OR REPLACE VIEW public.active_users AS
  SELECT users.id,
      users.status
     FROM users;
