init: |
  CREATE TYPE public.status AS ENUM ('active', 'inactive');
  CREATE DOMAIN public.status_domain AS public.status;
  CREATE TYPE public.status_pair AS (current public.status, history public.status[]);
  CREATE TABLE public.users (
      id integer NOT NULL,
      status public.status,
      history public.status[],
      CONSTRAINT users_pkey PRIMARY KEY (id)
  );
  CREATE VIEW public.active_users AS SELECT id, status FROM public.users;
