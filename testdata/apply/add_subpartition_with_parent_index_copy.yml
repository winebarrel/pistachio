# A new partitioned partition and its own partition both get the copy of the
# existing top-level index, so neither CREATE INDEX runs.
init: |
  CREATE TABLE public.logs (
      id integer NOT NULL,
      at date NOT NULL
  ) PARTITION BY RANGE (at);
  CREATE INDEX logs_at_idx ON public.logs USING btree (at) WHERE (id > 0);
