# ADD CONSTRAINT ... EXCLUDE on an existing table, run against the server.
init: |
  CREATE TABLE public.slots (
      r int4range NOT NULL,
      a integer NOT NULL
  );
desired: |
  CREATE TABLE public.slots (
      r int4range NOT NULL,
      a integer NOT NULL,
      CONSTRAINT slots_excl EXCLUDE USING gist (r WITH &&) WHERE (a > 0)
  );
applied: |
  -- public.slots
  CREATE TABLE public.slots (
      r int4range NOT NULL,
      a integer NOT NULL,
      CONSTRAINT slots_excl EXCLUDE USING gist (r WITH &&) WHERE (a > 0)
  );
