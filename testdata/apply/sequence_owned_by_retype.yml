# For a column written with its type and default, the sequence type changes
# only as the desired schema declares it. No ALTER SEQUENCE comes from the
# column's type change.
init: |
  CREATE SEQUENCE public.custom_seq AS integer;
  CREATE TABLE public.items (
      id integer DEFAULT nextval('custom_seq') NOT NULL
  );
  ALTER SEQUENCE public.custom_seq OWNED BY public.items.id;
desired: |
  CREATE SEQUENCE public.custom_seq AS bigint;
  CREATE TABLE public.items (
      id bigint DEFAULT nextval('custom_seq'::regclass) NOT NULL
  );
  ALTER SEQUENCE public.custom_seq OWNED BY public.items.id;
applied: |
  -- public.custom_seq
  CREATE SEQUENCE public.custom_seq
      AS bigint
      START WITH 1
      INCREMENT BY 1
      MINVALUE 1
      MAXVALUE 9223372036854775807
      CACHE 1;

  -- public.items
  CREATE TABLE public.items (
      id bigint DEFAULT nextval('custom_seq'::regclass) NOT NULL
  );

  ALTER SEQUENCE public.custom_seq OWNED BY public.items.id;
