# RENAME TO carries a view's INSTEAD OF triggers with it, so the plan holds
# the rename alone.
init: |
  CREATE FUNCTION public.stamp() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE public.users (
      id integer NOT NULL
  );
  CREATE VIEW public.active_users AS SELECT id FROM public.users;
  CREATE TRIGGER active_users_ins INSTEAD OF INSERT ON public.active_users
      FOR EACH ROW EXECUTE FUNCTION public.stamp();
desired: |
  CREATE TABLE public.users (
      id integer NOT NULL
  );
  -- pista:renamed-from public.active_users
  CREATE VIEW public.user_list AS SELECT id FROM public.users;
  CREATE TRIGGER active_users_ins INSTEAD OF INSERT ON user_list
      FOR EACH ROW EXECUTE FUNCTION stamp();
applied: |
  -- public.users
  CREATE TABLE public.users (
      id integer NOT NULL
  );

  -- public.user_list
  CREATE OR REPLACE VIEW public.user_list AS
  SELECT users.id
     FROM users;

  CREATE TRIGGER active_users_ins INSTEAD OF INSERT ON user_list FOR EACH ROW EXECUTE FUNCTION stamp();
applied_pg16: &applied_pg16plus |
  -- public.users
  CREATE TABLE public.users (
      id integer NOT NULL
  );

  -- public.user_list
  CREATE OR REPLACE VIEW public.user_list AS
  SELECT id
     FROM users;

  CREATE TRIGGER active_users_ins INSTEAD OF INSERT ON user_list FOR EACH ROW EXECUTE FUNCTION stamp();
applied_pg17: *applied_pg16plus
applied_pg18: *applied_pg16plus
