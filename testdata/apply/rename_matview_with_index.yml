init: |
  CREATE TABLE public.t (a integer);
  CREATE MATERIALIZED VIEW public.mv AS SELECT a FROM public.t;
  CREATE INDEX mv_ix ON public.mv (a);
desired: |
  CREATE TABLE public.t (a integer);
  -- pista:renamed-from public.mv
  CREATE MATERIALIZED VIEW public.mv2 AS SELECT a FROM public.t;
  CREATE INDEX mv_ix ON public.mv2 (a);
applied_sql: |
  ALTER MATERIALIZED VIEW public.mv RENAME TO mv2;
applied: |
  -- public.t
  CREATE TABLE public.t (
      a integer
  );

  -- public.mv2
  CREATE MATERIALIZED VIEW public.mv2 AS
  SELECT t.a
     FROM t;
  CREATE INDEX mv_ix ON public.mv2 USING btree (a);
applied_pg16: &applied_pg16plus |
  -- public.t
  CREATE TABLE public.t (
      a integer
  );

  -- public.mv2
  CREATE MATERIALIZED VIEW public.mv2 AS
  SELECT a
     FROM t;
  CREATE INDEX mv_ix ON public.mv2 USING btree (a);
applied_pg17: *applied_pg16plus
applied_pg18: *applied_pg16plus
