# A statement-level trigger that gains transition tables is replaced in place.
init: |
  CREATE FUNCTION public.audit() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NULL; END $$;
  CREATE TABLE public.items (
      id integer NOT NULL,
      CONSTRAINT items_pkey PRIMARY KEY (id)
  );
  CREATE TRIGGER items_updated AFTER UPDATE ON public.items FOR EACH STATEMENT EXECUTE FUNCTION public.audit();
desired: |
  CREATE TABLE public.items (
      id integer NOT NULL,
      CONSTRAINT items_pkey PRIMARY KEY (id)
  );
  CREATE TRIGGER items_updated AFTER UPDATE ON public.items REFERENCING OLD TABLE AS old_rows NEW TABLE AS new_rows FOR EACH STATEMENT EXECUTE FUNCTION public.audit();
applied_sql: |
  CREATE OR REPLACE TRIGGER items_updated AFTER UPDATE ON public.items REFERENCING OLD TABLE old_rows NEW TABLE new_rows EXECUTE FUNCTION public.audit();
applied: |
  -- public.items
  CREATE TABLE public.items (
      id integer NOT NULL,
      CONSTRAINT items_pkey PRIMARY KEY (id)
  );

  CREATE TRIGGER items_updated AFTER UPDATE ON items REFERENCING OLD TABLE AS old_rows NEW TABLE AS new_rows FOR EACH STATEMENT EXECUTE FUNCTION audit();
