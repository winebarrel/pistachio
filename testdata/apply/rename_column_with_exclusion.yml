      -- pista:renamed-from during
      time_range tsrange NOT NULL,
      CONSTRAINT reservations_pkey PRIMARY KEY (id),
      CONSTRAINT no_overlap EXCLUDE USING gist (room WITH =, time_range WITH &&)
  );
