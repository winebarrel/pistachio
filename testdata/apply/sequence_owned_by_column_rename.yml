# Renaming the owning column carries the ownership, so the rename alone plans
# no OWNED BY.
init: |
  CREATE SEQUENCE public.my_seq;
  CREATE TABLE public.t (
      a integer
  );
  ALTER SEQUENCE public.my_seq OWNED BY public.t.a;
desired: |
  CREATE SEQUENCE public.my_seq;
  CREATE TABLE public.t (
      -- pista:renamed-from a
      b integer
  );
  ALTER SEQUENCE public.my_seq OWNED BY public.t.b;
applied: |
  -- public.my_seq
  CREATE SEQUENCE public.my_seq
      AS bigint
      START WITH 1
      INCREMENT BY 1
      MINVALUE 1
      MAXVALUE 9223372036854775807
      CACHE 1;

  -- public.t
  CREATE TABLE public.t (
      b integer
  );

  ALTER SEQUENCE public.my_seq OWNED BY public.t.b;
