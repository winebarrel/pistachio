# After a table rename, a desired name equal to the new automatic name renames
# the kept constraint. The catalog then reads it as no name, and the re-plan
# is clean.
min_pg: 18
init: |
  CREATE TABLE public.items (
      id integer NOT NULL
  );
  ALTER TABLE public.items RENAME TO goods;
desired: |
  CREATE TABLE public.goods (
      id integer CONSTRAINT goods_id_not_null NOT NULL
  );
applied_sql: |
  ALTER TABLE public.goods RENAME CONSTRAINT items_id_not_null TO goods_id_not_null;
applied: |
  -- public.goods
  CREATE TABLE public.goods (
      id integer NOT NULL
  );
