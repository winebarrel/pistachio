# The parent's index is dropped in this plan, before the new partition is
# created, so the partition gets no copy and its own index is created.
drop_policy:
  allow_drop:
    - index
init: |
  CREATE TABLE public.logs (
      id integer NOT NULL,
      at date NOT NULL
  ) PARTITION BY RANGE (at);
  CREATE INDEX logs_at_idx ON public.logs USING btree (at);
desired: |
  CREATE TABLE public.logs (
      id integer NOT NULL,
      at date NOT NULL
  )
  PARTITION BY RANGE (at);

  CREATE TABLE public.logs_2026 PARTITION OF public.logs FOR VALUES FROM ('2026-01-01') TO ('2027-01-01');
  CREATE INDEX logs_2026_at_idx ON public.logs_2026 USING btree (at);
applied: |
  -- public.logs
  CREATE TABLE public.logs (
      id integer NOT NULL,
      at date NOT NULL
  )
  PARTITION BY RANGE (at);

  -- public.logs_2026
  CREATE TABLE public.logs_2026 PARTITION OF public.logs FOR VALUES FROM ('2026-01-01') TO ('2027-01-01');
  CREATE INDEX logs_2026_at_idx ON public.logs_2026 USING btree (at);
applied_sql: |
  DROP INDEX public.logs_at_idx;
  CREATE TABLE public.logs_2026 PARTITION OF public.logs FOR VALUES FROM ('2026-01-01') TO ('2027-01-01');
  CREATE INDEX logs_2026_at_idx ON public.logs_2026 USING btree (at);
