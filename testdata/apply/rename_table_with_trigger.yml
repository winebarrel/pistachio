# RENAME TO carries the table's trigger with it, so the apply holds the rename
# alone and the re-plan that follows finds nothing left to do.
init: |
  CREATE FUNCTION public.stamp() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE public.users (
      id integer NOT NULL
  );
  CREATE TRIGGER users_stamp BEFORE INSERT ON public.users
      FOR EACH ROW EXECUTE FUNCTION public.stamp();
desired: |
  -- pista:renamed-from public.users
  CREATE TABLE public.accounts (
      id integer NOT NULL
  );
  CREATE TRIGGER users_stamp BEFORE INSERT ON accounts
      FOR EACH ROW EXECUTE FUNCTION stamp();
applied_sql: |
  ALTER TABLE public.users RENAME TO accounts;
applied: |
  -- public.accounts
  CREATE TABLE public.accounts (
      id integer NOT NULL
  );

  CREATE TRIGGER users_stamp BEFORE INSERT ON accounts FOR EACH ROW EXECUTE FUNCTION stamp();
