# An INHERITS child gets no copy of its parent's index, so its index is
# created even under the name a partition's copy would take.
init: |
  CREATE TABLE public.logs (
      id integer NOT NULL,
      at date NOT NULL
  );
  CREATE INDEX logs_at_idx ON public.logs USING btree (at);
