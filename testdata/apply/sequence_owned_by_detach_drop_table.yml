# A sequence kept with no owner survives the drop of its table.
init: |
  CREATE SEQUENCE public.my_seq;
  CREATE TABLE public.t (
      id integer
  );
  ALTER SEQUENCE public.my_seq OWNED BY public.t.id;
desired: |
  CREATE SEQUENCE public.my_seq;
applied: |
  -- public.my_seq
  CREATE SEQUENCE public.my_seq
      AS bigint
      START WITH 1
      INCREMENT BY 1
      MINVALUE 1
      MAXVALUE 9223372036854775807
      CACHE 1;
