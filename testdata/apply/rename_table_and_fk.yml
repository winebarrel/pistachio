      id integer CONSTRAINT orders_id_not_null NOT NULL,
      user_id integer CONSTRAINT orders_user_id_not_null NOT NULL,
      CONSTRAINT orders_pkey PRIMARY KEY (id)
  );

  ALTER TABLE ONLY public.purchases ADD CONSTRAINT fk_buyer FOREIGN KEY (user_id) REFERENCES users(id);

