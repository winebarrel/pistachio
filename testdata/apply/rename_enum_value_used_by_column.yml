# A renamed enum value keeps the rows that hold it, and the column default
# that names it moves to the new name.
init: |
  CREATE TYPE public.status AS ENUM ('active', 'inactive');
  CREATE TABLE public.accounts (
      id integer NOT NULL,
      status public.status DEFAULT 'inactive' NOT NULL,
      CONSTRAINT accounts_pkey PRIMARY KEY (id)
  );
  INSERT INTO public.accounts VALUES (1, 'inactive');
desired: |
  CREATE TYPE public.status AS ENUM (
      'active',
      -- pista:renamed-from 'inactive'
      'disabled'
  );
  CREATE TABLE public.accounts (
      id integer NOT NULL,
      status public.status DEFAULT 'disabled' NOT NULL,
      CONSTRAINT accounts_pkey PRIMARY KEY (id)
  );
applied_sql: |
  ALTER TYPE public.status RENAME VALUE 'inactive' TO 'disabled';
  ALTER TABLE public.accounts ALTER COLUMN status SET DEFAULT 'disabled';
applied: |
  -- public.status
  CREATE TYPE public.status AS ENUM (
      'active',
      'disabled'
  );

  -- public.accounts
  CREATE TABLE public.accounts (
      id integer NOT NULL,
      status status DEFAULT 'disabled'::status NOT NULL,
      CONSTRAINT accounts_pkey PRIMARY KEY (id)
  );
