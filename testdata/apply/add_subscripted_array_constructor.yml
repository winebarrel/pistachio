# The parentheses in (ARRAY[...])[n] are kept.
init: |
  CREATE FUNCTION public.noop() RETURNS trigger LANGUAGE plpgsql AS $$BEGIN RETURN NEW; END$$;

  CREATE TABLE public.pairs (
      id integer NOT NULL,
      a integer,
      b integer,
      CONSTRAINT pairs_pkey PRIMARY KEY (id)
  );
