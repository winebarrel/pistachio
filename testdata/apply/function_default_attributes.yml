# pg_get_functiondef leaves the defaults out of its output, so a desired
# schema that spells VOLATILE, PARALLEL UNSAFE or COST 100 has to normalize to
# the same model or it would drift on every run.
manage_routine: true
init: ""
desired: |
  CREATE FUNCTION public.f() RETURNS integer
      LANGUAGE sql VOLATILE PARALLEL UNSAFE COST 100
      AS $$ SELECT 1 $$;
applied: |
  -- public.f()
  CREATE OR REPLACE FUNCTION public.f()
      RETURNS integer
      LANGUAGE sql
      AS $$ SELECT 1 $$;
verify_no_drift: true
