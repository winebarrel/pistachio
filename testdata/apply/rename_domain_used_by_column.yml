init: |
  CREATE DOMAIN public.positive_int AS integer CONSTRAINT pos_check CHECK (VALUE > 0);
  CREATE TYPE public.measure AS (value public.positive_int);
  CREATE TABLE public.items (
      id integer NOT NULL,
      qty public.positive_int,
      CONSTRAINT items_pkey PRIMARY KEY (id)
  );
  CREATE VIEW public.item_qty AS SELECT id, qty FROM public.items;
