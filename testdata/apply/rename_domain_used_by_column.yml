applied: |
  -- public.pos_int
  CREATE DOMAIN public.pos_int AS integer
      CONSTRAINT pos_check CHECK ((VALUE > 0));

  -- public.measure
  CREATE TYPE public.measure AS (
      value pos_int
  );

  -- public.items
  CREATE TABLE public.items (
      id integer NOT NULL,
      qty pos_int,
      CONSTRAINT items_pkey PRIMARY KEY (id)
  );

  -- public.item_qty
  CREATE OR REPLACE VIEW public.item_qty AS
  SELECT items.id,
      items.qty
     FROM items;
