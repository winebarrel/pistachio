# An unnamed CHECK takes the name pistachio generates from the columns its
# expression references, so the walker has to find the column inside the
# SQL/JSON constructor. PostgreSQL names this one products_qty_check; a walker
# that misses the column would name it products_check, and the next plan would
# drop and re-add the constraint forever. The post-apply re-plan pins that.
#
# The RETURNING clause is written out, since that is what the catalog holds and
# what the applied dump shows; the re-plan would fail without it.
min_pg: 16
init: |
  CREATE TABLE public.products (
      id integer NOT NULL,
      qty integer NOT NULL,
      CONSTRAINT products_pkey PRIMARY KEY (id)
  );
desired: |
  CREATE TABLE public.products (
      id integer NOT NULL,
      qty integer NOT NULL,
      CONSTRAINT products_pkey PRIMARY KEY (id),
      CHECK (JSON_ARRAY(qty RETURNING json) IS NOT NULL)
  );
applied: |
  -- public.products
  CREATE TABLE public.products (
      id integer NOT NULL,
      qty integer NOT NULL,
      CONSTRAINT products_pkey PRIMARY KEY (id),
      CONSTRAINT products_qty_check CHECK (JSON_ARRAY(qty RETURNING json) IS NOT NULL)
  );
