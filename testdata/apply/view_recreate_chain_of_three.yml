# Three views in a chain, all changing shape. The drops run deepest first and
# the creates in dependency order, which is what makes a dependent the same
# plan drops safe to leave out of the blocked-drop check.
drop_policy:
  allow_drop: [all]
init: |
  CREATE TABLE public.t (id integer NOT NULL, a text, b text, c text);
  CREATE VIEW public.v1 AS SELECT id, a, b, c FROM public.t;
  CREATE VIEW public.v2 AS SELECT id, a, b FROM public.v1;
  CREATE VIEW public.v3 AS SELECT id, a FROM public.v2;
desired: |
  CREATE TABLE public.t (id integer NOT NULL, a text, b text, c text);
  CREATE VIEW public.v1 AS SELECT id, a, b FROM public.t;
  CREATE VIEW public.v2 AS SELECT id, a FROM public.v1;
  CREATE VIEW public.v3 AS SELECT id FROM public.v2;
applied: |
  -- public.t
  CREATE TABLE public.t (
      id integer NOT NULL,
      a text,
      b text,
      c text
  );

  -- public.v1
  CREATE OR REPLACE VIEW public.v1 AS
  SELECT t.id,
      t.a,
      t.b
     FROM t;

  -- public.v2
  CREATE OR REPLACE VIEW public.v2 AS
  SELECT v1.id,
      v1.a
     FROM v1;

  -- public.v3
  CREATE OR REPLACE VIEW public.v3 AS
  SELECT v2.id
     FROM v2;
applied_pg16: &applied_pg16plus |
  -- public.t
  CREATE TABLE public.t (
      id integer NOT NULL,
      a text,
      b text,
      c text
  );

  -- public.v1
  CREATE OR REPLACE VIEW public.v1 AS
  SELECT id,
      a,
      b
     FROM t;

  -- public.v2
  CREATE OR REPLACE VIEW public.v2 AS
  SELECT id,
      a
     FROM v1;

  -- public.v3
  CREATE OR REPLACE VIEW public.v3 AS
  SELECT id
     FROM v2;
applied_pg17: *applied_pg16plus
applied_pg18: *applied_pg16plus
