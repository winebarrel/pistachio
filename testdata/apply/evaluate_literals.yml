evaluate_literals: true
init: |
  CREATE DOMAIN public.dur AS interval DEFAULT '1 hour' CONSTRAINT dur_check CHECK (VALUE > '30 minutes');
  CREATE TABLE public.t (
      id integer NOT NULL,
      iv interval DEFAULT '1 hour',
      d date DEFAULT '2020-1-1',
      CONSTRAINT t_pkey PRIMARY KEY (id),
      CONSTRAINT t_iv_check CHECK (iv < '1 day')
  );
desired: |
  CREATE DOMAIN public.dur AS interval DEFAULT '2 hours' CONSTRAINT dur_check CHECK (VALUE > '30 minutes');
  CREATE TABLE public.t (
      id integer NOT NULL,
      iv interval DEFAULT '2 hours',
      d date DEFAULT '2020-1-1',
      CONSTRAINT t_pkey PRIMARY KEY (id),
      CONSTRAINT t_iv_check CHECK (iv < '1 day')
  );
applied: |
  -- public.dur
  CREATE DOMAIN public.dur AS interval DEFAULT '02:00:00'::interval
      CONSTRAINT dur_check CHECK ((VALUE > '00:30:00'::interval));

  -- public.t
  CREATE TABLE public.t (
      id integer NOT NULL,
      iv interval DEFAULT '02:00:00'::interval,
      d date DEFAULT '2020-01-01'::date,
      CONSTRAINT t_pkey PRIMARY KEY (id),
      CONSTRAINT t_iv_check CHECK (iv < '1 day'::interval)
  );
