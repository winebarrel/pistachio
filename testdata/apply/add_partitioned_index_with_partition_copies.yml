# The partition's copy is created first, and the parent's index attaches it.
init: |
  CREATE TABLE public.logs (
      id bigint NOT NULL,
      at date NOT NULL
  ) PARTITION BY RANGE (at);
  CREATE TABLE public.logs_2025 PARTITION OF public.logs FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');
desired: |
  CREATE TABLE public.logs (
      id bigint NOT NULL,
      at date NOT NULL
  ) PARTITION BY RANGE (at);
  CREATE INDEX logs_id_idx ON public.logs USING btree (id);
  CREATE TABLE public.logs_2025 PARTITION OF public.logs FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');
  CREATE INDEX logs_2025_by_id ON public.logs_2025 USING btree (id);
applied: |
  -- public.logs
  CREATE TABLE public.logs (
      id bigint NOT NULL,
      at date NOT NULL
  )
  PARTITION BY RANGE (at);
  CREATE INDEX logs_id_idx ON public.logs USING btree (id);

  -- public.logs_2025
  CREATE TABLE public.logs_2025 PARTITION OF public.logs FOR VALUES FROM ('2025-01-01') TO ('2026-01-01');
  CREATE INDEX logs_2025_by_id ON public.logs_2025 USING btree (id);
applied_sql: |
  CREATE INDEX logs_2025_by_id ON public.logs_2025 USING btree (id);
  CREATE INDEX logs_id_idx ON public.logs USING btree (id);
