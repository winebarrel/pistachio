# Pins that the order the plan picks is one PostgreSQL accepts: the referencing
# table turns unlogged before the table it references.
init: |
  CREATE TABLE public.parent (
      id integer NOT NULL,
      CONSTRAINT parent_pkey PRIMARY KEY (id)
  );
  CREATE TABLE public.child (
      id integer NOT NULL,
      p integer,
      CONSTRAINT child_pkey PRIMARY KEY (id),
      CONSTRAINT child_p_fkey FOREIGN KEY (p) REFERENCES public.parent(id)
  );
desired: |
  CREATE UNLOGGED TABLE public.parent (
      id integer NOT NULL,
      CONSTRAINT parent_pkey PRIMARY KEY (id)
  );
  CREATE UNLOGGED TABLE public.child (
      id integer NOT NULL,
      p integer,
      CONSTRAINT child_pkey PRIMARY KEY (id),
      CONSTRAINT child_p_fkey FOREIGN KEY (p) REFERENCES public.parent(id)
  );
applied_sql: |
  ALTER TABLE public.child SET UNLOGGED;
  ALTER TABLE public.parent SET UNLOGGED;
applied: |
  -- public.child
  CREATE UNLOGGED TABLE public.child (
      id integer NOT NULL,
      p integer,
      CONSTRAINT child_pkey PRIMARY KEY (id)
  );

  ALTER TABLE ONLY public.child ADD CONSTRAINT child_p_fkey FOREIGN KEY (p) REFERENCES parent(id);

  -- public.parent
  CREATE UNLOGGED TABLE public.parent (
      id integer NOT NULL,
      CONSTRAINT parent_pkey PRIMARY KEY (id)
  );
