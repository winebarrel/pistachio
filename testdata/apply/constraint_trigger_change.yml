# A constraint trigger changing its function. PostgreSQL rejects
# CREATE OR REPLACE CONSTRAINT TRIGGER, so the change runs as a drop and a
# create.
init: |
  CREATE FUNCTION public.stamp() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE FUNCTION public.stamp2() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE public.events (id integer NOT NULL);
  CREATE CONSTRAINT TRIGGER events_check AFTER INSERT ON public.events DEFERRABLE INITIALLY DEFERRED FOR EACH ROW EXECUTE FUNCTION public.stamp();
desired: |
  CREATE TABLE public.events (id integer NOT NULL);
  CREATE CONSTRAINT TRIGGER events_check AFTER INSERT ON public.events DEFERRABLE INITIALLY DEFERRED FOR EACH ROW EXECUTE FUNCTION stamp2();
drop_policy:
  allow_drop:
    - trigger
applied: |
  -- public.events
  CREATE TABLE public.events (
      id integer NOT NULL
  );

  CREATE CONSTRAINT TRIGGER events_check AFTER INSERT ON events DEFERRABLE INITIALLY DEFERRED FOR EACH ROW EXECUTE FUNCTION stamp2();
