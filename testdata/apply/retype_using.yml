applied: |
  -- public.item_status
  CREATE TYPE public.item_status AS ENUM (
      'active',
      'inactive'
  );

  -- public.items
  CREATE TABLE public.items (
      id integer NOT NULL,
      status item_status DEFAULT 'active'::item_status NOT NULL,
      flag boolean,
      CONSTRAINT items_pkey PRIMARY KEY (id)
  );
