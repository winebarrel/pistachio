rules:
  # Another index has the same columns, INCLUDE columns, access method and
  # uniqueness. Sort order, operator classes and WHERE clauses are not
  # compared, so a partial index and an index on an expression are skipped.
  - name: duplicate-index
    on: index
    assert: >-
      index.partial || null in index.columns || !table.indexes.values().exists(o,
        o.name != index.name && !o.partial
        && o.columns == index.columns && o.include == index.include
        && o.method == index.method && o.unique == index.unique)
    message: another index has the same definition

  # A B-tree index whose columns start another B-tree index. The longer
  # index serves the same queries. A unique index enforces a constraint, so
  # it is skipped.
  - name: redundant-index
    on: index
    assert: >-
      index.partial || index.unique || index.method != "btree" || null in index.columns
      || !table.indexes.values().exists(o,
           o.name != index.name && !o.partial && o.method == "btree"
           && size(o.columns) > size(index.columns) && hasPrefix(o.columns, index.columns))
    message: another index starts with the same columns
