# Both rules compare an index's definition from USING on: the access method,
# the columns and expressions with their operator classes, collations and
# sort order, INCLUDE and WHERE. WITH (...) and TABLESPACE are removed first,
# since they do not change the queries an index serves.
rules:
  - name: duplicate-index
    on: index
    assert: >-
      cel.bind(key,
        regex.replace(index.definition.substring(index.definition.indexOf(" USING ")),
          " WITH \\([^)]*\\)| TABLESPACE [^ ]+", ""),
        !table.indexes.values().exists(o, o.name != index.name && o.unique == index.unique
          && regex.replace(o.definition.substring(o.definition.indexOf(" USING ")),
               " WITH \\([^)]*\\)| TABLESPACE [^ ]+", "") == key))
    message: another index has the same definition

  # A B-tree index whose key elements start another B-tree index, written the
  # same way. The longer index serves the same queries. A unique index
  # enforces a constraint, and a partial index or one with INCLUDE covers
  # other queries, so they are skipped.
  - name: redundant-index
    on: index
    assert: >-
      index.unique || index.partial || index.method != "btree" || size(index.include) > 0
      || cel.bind(key,
           regex.replace(index.definition.substring(index.definition.indexOf(" USING ")),
             " WITH \\([^)]*\\)| TABLESPACE [^ ]+", ""),
           !table.indexes.values().exists(o,
             o.name != index.name && !o.partial && o.method == "btree"
             && o.definition.substring(o.definition.indexOf(" USING "))
                  .startsWith(key.substring(0, size(key) - 1) + ", ")))
    message: another index starts with the same columns
