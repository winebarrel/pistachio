rules:
  # Another index has the same definition apart from its name: the same
  # uniqueness, and the same text from USING on. That text holds the access
  # method, the columns and expressions with their operator classes,
  # collations and sort order, INCLUDE and WHERE.
  - name: duplicate-index
    on: index
    assert: >-
      !table.indexes.values().exists(o, o.name != index.name && o.unique == index.unique
        && o.definition.substring(o.definition.indexOf(" USING "))
           == index.definition.substring(index.definition.indexOf(" USING ")))
    message: another index has the same definition

  # A B-tree index whose key elements start another B-tree index, written
  # the same way. The longer index serves the same queries. A unique index
  # enforces a constraint, and a partial index or one with INCLUDE covers
  # other queries, so they are skipped.
  - name: redundant-index
    on: index
    assert: >-
      index.unique || index.partial || index.method != "btree" || size(index.include) > 0
      || !table.indexes.values().exists(o,
           o.name != index.name && !o.partial && o.method == "btree"
           && o.definition.substring(o.definition.indexOf(" USING ")).startsWith(
                index.definition.substring(index.definition.indexOf(" USING "),
                  size(index.definition) - 1) + ", "))
    message: another index starts with the same columns
