site_name: pistachio
site_description: Declarative schema management tool for PostgreSQL
site_url: https://winebarrel.github.io/pistachio/
repo_url: https://github.com/winebarrel/pistachio
repo_name: winebarrel/pistachio
edit_uri: edit/main/docs/

theme:
  name: material
  favicon: assets/favicon.ico
  # The header draws the logo at 24px next to site_name, so this is the nut
  # mark on its own. The full logo carries the wordmark, which would be
  # illegible at that size and repeat the name beside it.
  logo: assets/logo-mark.webp
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  # Listing plugins turns off the default set, so search has to be named again.
  - search
  # Generates a preview image per page and the og:/twitter: meta tags that point
  # at it, so a link to the site expands into a card.
  - social

hooks:
  - hooks.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
      - guides/renaming.md
      - guides/multiple-schemas.md
      - guides/filtering.md
      - guides/drops.md
      - guides/transactions.md
      - guides/executing-sql.md
      - guides/splitting.md
  - Reference:
      - reference/commands.md
      - reference/directives.md
      - reference/objects.md
      - reference/configuration.md
  - About:
      - about/design.md
      - Known limitations: about/limitations.md
      - about/performance.md
      - about/changelog.md
  - Contributing:
      - contributing.md
      - contributing-samples.md
