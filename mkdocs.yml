site_name: pistachio
site_description: Declarative schema management tool for PostgreSQL
site_url: https://winebarrel.github.io/pistachio/
repo_url: https://github.com/winebarrel/pistachio
repo_name: winebarrel/pistachio
edit_uri: edit/main/docs/

theme:
  name: material
  # Holds partials/integrations/analytics/custom.html, the analytics snippet.
  custom_dir: overrides
  favicon: assets/favicon.ico
  # The header draws the logo at 24px next to site_name, so this is the nut
  # mark on its own. The full logo carries the wordmark, which would be
  # illegible at that size and repeat the name beside it.
  logo: assets/logo-mark.svg
  features:
    - navigation.sections
    # A section with an index.md opens that page when clicked. Guides and the
    # Commands section under Reference are two.
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  # Listing plugins turns off the default set, so search has to be named again.
  - search
  # Generates a preview image per page and the og:/twitter: meta tags that point
  # at it, so a link to the site expands into a card.
  - social

hooks:
  - hooks.py

extra:
  analytics:
    provider: custom

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  # The option lists on the command pages are definition lists.
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - guides/index.md
      - Writing the schema:
          - guides/multiple-schemas.md
          - guides/renaming.md
          - guides/executing-sql.md
      - Running plan and apply:
          - guides/drops.md
          - guides/filtering.md
          - guides/transactions.md
          - guides/explaining-plans.md
          - guides/plan-files.md
          - guides/exclusive-apply.md
      - Without a database:
          - guides/diffing.md
          - guides/formatting.md
          - guides/parsing.md
  - Reference:
      - Commands:
          - reference/commands/index.md
          - reference/commands/plan.md
          - reference/commands/apply.md
          - reference/commands/apply-from.md
          - reference/commands/dump.md
          - reference/commands/diff.md
          - reference/commands/fmt.md
          - reference/commands/parse.md
      - reference/directives.md
      - reference/objects.md
      - reference/configuration.md
      - reference/environment.md
      - reference/exit-status.md
      - reference/output.md
      - reference/glossary.md
  - About:
      - about/design.md
      - Known limitations: about/limitations.md
      - about/performance.md
      - about/changelog.md
  - Contributing:
      - contributing.md
