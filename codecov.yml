# Wait for all coverage uploads before evaluating status or commenting.
# There are seven: the four PG-version test jobs plus the three windows
# jobs, which split the tests between them.
# The pager's sh -c / cmd /c split is platform-exclusive, so patch
# coverage is only complete once both OSes have reported; evaluating
# after the Linux uploads alone would report a spurious low patch %.
codecov:
  notify:
    after_n_builds: 7
    wait_for_ci: true

comment:
  after_n_builds: 7

coverage:
  status:
    project:
      default:
        target: 88%
    patch:
      default:
        target: 75%

ignore:
  - "internal/testutil"
  - "cmd/gen-json-schema"
