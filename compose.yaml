# One service per PostgreSQL version in the CI matrix, each on its own port
# 54<version>, so several versions can run side by side and a test run picks
# one by port. pg15 is the default and starts with a bare `up`; the others are
# held back by a profile, which naming one on the command line also enables.
#
#   docker compose up -d              # 15 only
#   docker compose up -d pg17         # 17 only
#   docker compose --profile all up -d
#
# The discourse sample declares `CREATE EXTENSION vector`, the osm and
# inaturalist samples `CREATE EXTENSION postgis`, and the dhis2 loader creates
# postgis for the sample, neither of which the official image ships, so install
# pgvector and PostGIS from PGDG before starting the server. The image's
# entrypoint runs as root and drops to postgres itself, so apt runs first and
# hands over with exec. Starting a container therefore needs network access;
# the samples CI job installs the same packages into its service container.
#
# The data directory is a tmpfs and the server skips WAL flushes. Every fixture
# drops and recreates `public`, and each of those commits otherwise waits on
# the disk. Nothing in the container survives a restart: the test databases
# are created again on first use, and `make schema` has to be run again. The
# sample schemas take memory accordingly. The tmpfs goes where each image
# declares its volume, or an anonymous volume on disk is mounted over it:
# /var/lib/postgresql/data up to 17, /var/lib/postgresql from 18, which refuses
# to start with a mount at the old path.
x-postgres: &postgres
  environment:
    POSTGRES_HOST_AUTH_METHOD: trust
  tmpfs:
    - /var/lib/postgresql/data
  entrypoint:
    - bash
    - -c
    - >-
      apt-get update -qq && apt-get install -y -qq --no-install-recommends
      postgresql-$${PG_MAJOR}-pgvector postgresql-$${PG_MAJOR}-postgis-3
      && exec docker-entrypoint.sh postgres
      -c fsync=off -c synchronous_commit=off -c full_page_writes=off

services:
  pg15:
    <<: *postgres
    image: postgres:15
    ports:
      - "5415:5432"
  pg16:
    <<: *postgres
    image: postgres:16
    profiles: ["all"]
    ports:
      - "5416:5432"
  pg17:
    <<: *postgres
    image: postgres:17
    profiles: ["all"]
    ports:
      - "5417:5432"
  pg18:
    <<: *postgres
    image: postgres:18
    profiles: ["all"]
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "5418:5432"
