name: release-tag
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Runs on the merge of a release pull request. The merge commit message is
  # "Merge pull request #N from owner/release-from-vX.Y.Z" followed by the
  # pull request's title as it stood at the merge, "Release for vX.Y.Z".
  # The title and the merger are checked in this job, before the approval,
  # so that a bad one stops here without asking for it.
  version:
    if: contains(github.event.head_commit.message, '/release-from-')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          # Each signer has an environment named release-<login> that holds
          # only their key and only they can approve. Refusing anyone else
          # here keeps their merge from referring to, and so creating, an
          # environment of their own.
          case "$ACTOR" in
            winebarrel) ;;
            *) echo "::error::$ACTOR merged the release pull request but has no signing key"; exit 1 ;;
          esac
          version=$(sed -n 's/^Release for v\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p' <<<"$MESSAGE")
          if [ -z "$version" ]; then
            echo "::error::The release pull request's title is not \"Release for vX.Y.Z\""
            exit 1
          fi
          latest=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v[0-9]*' | sed 's|.*refs/tags/v||' | sort -V | tail -n 1)
          if [ "$(printf '%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ] || [ "$version" = "$latest" ]; then
            echo "::error::v$version is not newer than the latest tag v$latest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}

  tag:
    needs: version
    runs-on: ubuntu-latest
    environment: release-${{ github.actor }}
    steps:
      # Before CHANGELOG.md is touched, so that a key that is missing,
      # malformed or locked by another passphrase cannot leave a release
      # commit without its tag. A test signature proves all three.
      - name: Set up the signing key
        run: |
          if [ -z "$RELEASE_GPG_KEY" ]; then
            echo "::error::RELEASE_GPG_KEY is not set in the release-$ACTOR environment"
            exit 1
          fi
          if ! gpg --batch --import <<<"$RELEASE_GPG_KEY"; then
            echo "::error::RELEASE_GPG_KEY is not a key gpg can import"
            exit 1
          fi
          keys=$(gpg --list-secret-keys --with-colons)
          fpr=$(awk -F: '$1 == "fpr" { print $10; exit }' <<<"$keys")
          uid=$(awk -F: '$1 == "uid" { print $10; exit }' <<<"$keys")
          if [ -z "$fpr" ]; then
            echo "::error::RELEASE_GPG_KEY holds no secret key"
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"
          cat > "$RUNNER_TEMP/gpg-sign" <<EOF
          #!/bin/sh
          exec gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/gpg-passphrase" "\$@"
          EOF
          chmod 700 "$RUNNER_TEMP/gpg-sign"
          if ! echo test | "$RUNNER_TEMP/gpg-sign" --local-user "$fpr" --detach-sign > /dev/null; then
            echo "::error::The key in RELEASE_GPG_KEY cannot sign; check RELEASE_GPG_PASSPHRASE and its expiry"
            exit 1
          fi
          # GitHub shows the tag as Verified only when the tagger email is
          # the one in the key.
          git config --global user.name "${uid% <*}"
          git config --global user.email "$(sed 's/.*<\(.*\)>.*/\1/' <<<"$uid")"
          git config --global user.signingkey "$fpr"
          git config --global gpg.program "$RUNNER_TEMP/gpg-sign"
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          ACTOR: ${{ github.actor }}
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # Rename [Unreleased] to the version and date in a commit made through
      # the API, which GitHub signs for the App. Without that section the
      # merge commit itself is tagged.
      - id: changelog
        run: |
          file=$(gh api "repos/$GH_REPO/contents/CHANGELOG.md?ref=main")
          content=$(jq -r .content <<<"$file" | base64 -d)
          # A re-run after the release commit landed but the tag did not:
          # tag that commit rather than the merge.
          if grep -qF "## [$VERSION] - " <<<"$content"; then
            target=$(gh api "repos/$GH_REPO/commits?path=CHANGELOG.md&sha=main&per_page=1" \
              --jq ".[0] | select(.commit.message == \"Release v$VERSION\") | .sha")
            if [ -z "$target" ]; then
              echo "::error::CHANGELOG.md already has [$VERSION], but not from a Release v$VERSION commit"
              exit 1
            fi
            echo "target=$target" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          renamed=$(sed "s/^## \[Unreleased\]\$/## [$VERSION] - $(TZ=Asia/Tokyo date +%Y-%m-%d)/" <<<"$content")
          if [ "$renamed" = "$content" ]; then
            echo "target=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target=$(gh api -X PUT "repos/$GH_REPO/contents/CHANGELOG.md" \
            -f message="Release v$VERSION" \
            -f content="$(base64 -w 0 <<<"$renamed")" \
            -f sha="$(jq -r .sha <<<"$file")" \
            -f branch=main \
            --jq .commit.sha)
          echo "target=$target" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      # The App token pushes the tag, so that the push starts release.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.changelog.outputs.target }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Sign and push the tag
        run: |
          git tag -s "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
