# Build the documentation site with MkDocs and publish it to GitHub Pages.
# The Markdown under docs/ is the source; the HTML is built here and never
# committed. --strict fails the build on a broken internal link.
#
# The site follows releases, not main: a release tag publishes it, so it never
# describes a change that has not been released. release-tag.yml pushes the
# tag with the App token, which is what lets that push start this workflow.
# Running it by hand on a tag republishes that tag's docs. Running it by hand
# on main publishes main, for a docs fix that should not wait for a release.
name: docs

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:
  pull_request:
    paths:
      - docs/**
      - overrides/**
      - mkdocs.yml
      - hooks.py
      - requirements-docs.txt
      - CHANGELOG.md
      - LIMITATIONS.md
      - .github/workflows/docs.yml

permissions:
  contents: read

# One Pages deployment at a time. Two runs in quick succession would otherwise
# race, and cancelling the older one would publish out of order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      # Cairo and its friends are what the social plugin renders the card
      # images with. Pillow and CairoSVG bind to them but do not ship them.
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  # A release tag or a manual run on main or a tag publishes. A pull request
  # builds to catch a broken link and stops there.
  deploy:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
