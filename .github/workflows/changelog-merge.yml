name: changelog-merge
on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Two pull requests that each add an entry under [Unreleased] conflict
  # once one of them is merged, and the web UI does not run merge drivers.
  # A release renames [Unreleased] without a conflict, and merging a pull
  # request written before it puts the pull request's entry under the
  # released version. For every open pull request into main that changes
  # CHANGELOG.md, this merges main into its branch with
  # scripts/merge-changelog.sh, and pushes the merge commit when the file
  # differs from what a text merge gives, a conflict included. A pull
  # request that conflicts anywhere else, or comes from a fork, is left
  # alone.
  merge:
    runs-on: ubuntu-latest
    steps:
      # The App token, unlike GITHUB_TOKEN, lets CI run on the pushed merge.
      - id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Merge main into the pull requests
        run: |
          id=$(gh api "users/$SLUG%5Bbot%5D" --jq .id)
          git config user.name "$SLUG[bot]"
          git config user.email "$id+$SLUG[bot]@users.noreply.github.com"
          # The driver is taken from main, since a branch may predate it.
          # Without merge.changelog.driver, as in the check below, git
          # merges the file as text.
          cp scripts/merge-changelog.sh "$RUNNER_TEMP/"
          echo 'CHANGELOG.md merge=changelog' >> .git/info/attributes
          main=$(git rev-parse HEAD)
          branches=$(gh pr list --state open --base main --limit 200 --json headRefName,isCrossRepository,files \
            --jq '.[] | select((.isCrossRepository | not) and any(.files[]; .path == "CHANGELOG.md")) | .headRefName')
          for branch in $branches; do
            git fetch -q origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            # The text merge, which is what merging the pull request does.
            if tree=$(git merge-tree --write-tree --name-only --no-messages "$main" "origin/$branch"); then
              # A pull request that deletes the file has nothing to fix.
              text=$(git rev-parse -q --verify "$tree:CHANGELOG.md") || continue
            elif [ "$(sed 1d <<<"$tree")" = CHANGELOG.md ]; then
              text=
            else
              echo "::notice::$branch conflicts with main outside CHANGELOG.md; skipped"
              continue
            fi
            git checkout -q -B work "origin/$branch"
            if ! git -c merge.changelog.driver="bash $RUNNER_TEMP/merge-changelog.sh %O %A %B" \
                merge -q --no-edit -m "Merge branch 'main' into $branch" "$main"; then
              git merge --abort
              echo "::warning::$branch: CHANGELOG.md conflicts outside [Unreleased]; skipped"
              continue
            fi
            if [ "$(git rev-parse HEAD:CHANGELOG.md)" = "$text" ]; then
              continue
            fi
            # GitHub signs a commit made through the API, not one pushed, so
            # send the merge as a tree over the branch's. A blob main does
            # not hold, such as the merged CHANGELOG.md, is uploaded first.
            head=$(git rev-parse "origin/$branch")
            : > "$RUNNER_TEMP/entries"
            while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
              read -r oldmode mode _ sha status <<<"$meta"
              if [ "$status" = D ]; then
                jq -nc --arg path "$path" --arg mode "${oldmode#:}" \
                  '{path: $path, mode: $mode, type: "blob", sha: null}' >> "$RUNNER_TEMP/entries"
                continue
              fi
              if [ "$(git rev-parse -q --verify "$main:$path")" != "$sha" ]; then
                sha=$(git cat-file blob "$sha" | base64 -w0 | jq -Rc '{content: ., encoding: "base64"}' |
                  gh api "repos/$GH_REPO/git/blobs" --input - --jq .sha)
              fi
              jq -nc --arg path "$path" --arg mode "$mode" --arg sha "$sha" \
                '{path: $path, mode: $mode, type: "blob", sha: $sha}' >> "$RUNNER_TEMP/entries"
            done < <(git diff --raw -z --no-abbrev --no-renames "$head" HEAD)
            tree=$(jq -s --arg base "$(git rev-parse "$head^{tree}")" '{base_tree: $base, tree: .}' "$RUNNER_TEMP/entries" |
              gh api "repos/$GH_REPO/git/trees" --input - --jq .sha)
            if [ "$tree" != "$(git rev-parse 'HEAD^{tree}')" ]; then
              echo "::warning::$branch: the tree built through the API differs from the merge; skipped"
              continue
            fi
            commit=$(gh api "repos/$GH_REPO/git/commits" -f message="Merge branch 'main' into $branch" \
              -f tree="$tree" -f "parents[]=$head" -f "parents[]=$main" --jq .sha)
            # Not forced: a branch that moved since the fetch is left for
            # the next run.
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$branch" -f sha="$commit" -F force=false --silent ||
              echo "::warning::$branch: update rejected"
          done
        env:
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
