name: release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: write
  packages: write

env:
  # The tag is <Go version>-<goreleaser version>. The image runs with the token
  # that writes the release and the tap, so pin it by digest: a tag can be
  # moved, and the Go-only tag moves whenever goreleaser is released. Renovate
  # updates the tag and the digest together. The image is pulled from Docker
  # Hub, not ghcr.io, because only Docker Hub gives Renovate the push time
  # that minimumReleaseAge needs.
  GOLANG_CROSS_VERSION: v1.27.3-v2.18.3@sha256:1820cee53c4c06cfb43c2203caca73f9497042f5b6061c8916a251228a321975

jobs:
  # A release tag must be signed by a key in RELEASE_GPG_PUBLIC_KEYS. The keys
  # are read from a secret, not from the repository, so that the commit a tag
  # points at cannot add a key of its own. The keyring holds those keys alone,
  # so a good signature is a signature by one of them.
  verify-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify the tag signature
        run: |
          if [ -z "$RELEASE_GPG_PUBLIC_KEYS" ]; then
            echo "::error::RELEASE_GPG_PUBLIC_KEYS is not set"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          if ! gpg --batch --import <<<"$RELEASE_GPG_PUBLIC_KEYS"; then
            echo "::error::RELEASE_GPG_PUBLIC_KEYS is not a key gpg can import"
            exit 1
          fi
          git init -q
          git fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "+$GITHUB_REF:$GITHUB_REF"
          if [ "$(git rev-parse "$GITHUB_REF^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME no longer points at $GITHUB_SHA"
            exit 1
          fi
          if ! git verify-tag "$GITHUB_REF_NAME"; then
            echo "::error::$GITHUB_REF_NAME is not signed by a key in RELEASE_GPG_PUBLIC_KEYS"
            exit 1
          fi
        env:
          RELEASE_GPG_PUBLIC_KEYS: ${{ secrets.RELEASE_GPG_PUBLIC_KEYS }}

  goreleaser:
    runs-on: ubuntu-latest
    needs:
      - verify-tag
    # GoReleaser publishes with the app token, so GITHUB_TOKEN only checks out.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # GoReleaser writes the release here and the cask to the tap repository.
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: pistachio,homebrew-pistachio
          permission-contents: write
      # The release notes link the release pull request, the nearest release
      # merge before the tag on main. Other merges can come between: release-tag
      # tags main as it stands after the approval. They also list the pull
      # requests in its body, from "## Pull requests" on, with the backticks
      # around each author dropped so that the release mentions them. The
      # links above that section are left out: release-tag may still be
      # pinning them when this runs.
      - name: Find the release pull request
        run: |
          number=$(git log -1 --first-parent --format=%s -E \
            --grep='^Merge pull request #[0-9]+ from [^ ]*/release-from-v' "$GITHUB_REF_NAME" |
            sed -n 's/^Merge pull request #\([0-9]\+\) .*/\1/p')
          if [ -z "$number" ]; then
            echo "::error::No release pull request merge precedes $GITHUB_REF_NAME"
            exit 1
          fi
          prs=$(gh pr view "$number" --json body --jq .body |
            sed -n '/^## Pull requests$/,$p' |
            sed -E 's/^(- \[#[0-9]+\]\([^)]*\) .* by )`(@[^`]+)`$/\1\2/')
          {
            echo "RELEASE_PR=$number"
            echo "RELEASE_PRS<<EOF_RELEASE_PRS"
            echo "$prs"
            echo "EOF_RELEASE_PRS"
          } >> "$GITHUB_ENV"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        run: |
          docker run -q \
            --rm \
            -e CGO_ENABLED=1 \
            -e GITHUB_TOKEN \
            -e RELEASE_PR \
            -e RELEASE_PRS \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            "docker.io/goreleaser/goreleaser-cross:${GOLANG_CROSS_VERSION}" \
            release --clean --release-notes-tmpl .github/release-notes.md.tmpl
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      # checksums.txt lists every release asset but itself, so attest the
      # listed assets and then checksums.txt.
      - name: Attest release assets
        uses: actions/attest@v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest checksums.txt
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/checksums.txt
      # Homebrew and the packages install the binary out of the archive, so
      # attest the binary as well for a check of the installed pista.
      - name: Attest binaries
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/*/pista
            dist/*/pista.exe

  docker-build:
    needs:
      - verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - *checkout
      - &setup-buildx
        uses: docker/setup-buildx-action@v4.4.1
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
      - &login-ghcr
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PISTA_VERSION=${{ github.ref_name }}
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker:
    runs-on: ubuntu-latest
    needs:
      - docker-build
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - *setup-buildx
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
      - *login-ghcr
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # intentional word splitting to pass each -t flag and digest as separate args
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
      # gh attestation verify resolves the tag to the manifest list, so attest
      # that digest.
      - name: Get manifest list digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image
        uses: actions/attest@v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          # Storage records are for organization-owned repositories only.
          create-storage-record: false

  demo:
    needs:
      - verify-tag
    uses: ./.github/workflows/demo.yml

  # The playground in pistachio-demo offers the newest releases. Its update
  # workflow runs daily; starting it here opens the pull request as soon as
  # the release binaries it downloads are published.
  update-demo:
    runs-on: ubuntu-latest
    needs:
      - goreleaser
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: pistachio-demo
          permission-actions: write
      - name: Run the update workflow of pistachio-demo
        run: gh workflow run update-pista.yml --repo "$GITHUB_REPOSITORY_OWNER/pistachio-demo"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # Tell the person who merged the release pull request how the release
  # went, with a comment on that pull request that mentions them.
  notify:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - goreleaser
      - docker-build
      - docker
      - demo
      - update-demo
    permissions:
      pull-requests: write
    steps:
      - name: Comment on the release pull request
        run: |
          found=$(gh pr list --label release --state merged --search "\"Release for $TAG\" in:title" --json number,title,mergedBy \
            --jq ".[] | select(.title == \"Release for $TAG\") | \"\(.number) \(.mergedBy.login)\"")
          read -r number merger <<<"$found"
          if [ -z "$number" ]; then
            echo "::warning::No merged release pull request is titled \"Release for $TAG\""
            exit 0
          fi
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "- \(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -z "$failed" ]; then
            body="@$merger $TAG is released."
          else
            body="@$merger The release of $TAG did not finish."$'\n\n'"$failed"
          fi
          body+=$'\n\n'"$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          gh pr comment "$number" --body "$body"
        env:
          TAG: ${{ github.ref_name }}
          NEEDS: ${{ toJSON(needs) }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
