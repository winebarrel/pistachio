name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -xeo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ascii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check for non-ASCII characters
        run: |
          matches=$(LC_ALL=C git grep -nIP '[^\x00-\x7F]' -- .) && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Error: non-ASCII characters found:"
            echo "$matches"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "Error: git grep failed with status $status"
            exit "$status"
          fi

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make test-changelog

  keywords:
    runs-on: ubuntu-latest
    # model/testdata/keywords.txt is generated from the kwlist.h bundled with
    # pg_query_go. Regenerate it and fail if the checked-in copy differs, which
    # is what happens when pg_query_go is upgraded without running
    # `make keywords`.
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # gen-keywords.sh reads kwlist.h out of the module cache, so the module
      # has to be on disk before it runs.
      - run: go mod download github.com/pganalyze/pg_query_go/v6
      - run: make keywords
      # A diff here means the corpus is stale: run `make keywords` and commit it.
      - run: git diff --exit-code -- model/testdata/keywords.txt

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # A diff here means go.mod or go.sum is stale: run `go mod tidy` and
      # commit it.
      - run: go mod tidy -diff

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
      - run: make deadcode
      - run: make check-test-imports

  windows:
    runs-on: windows-latest
    # cgo (libpg_query) builds with the mingw-w64 gcc bundled in the
    # windows-latest image, found on PATH as gcc. This deliberately
    # exercises the native Windows toolchain; the release binary is
    # cross-built with mingw-w64 via goreleaser-cross (.goreleaser.yml).
    #
    # The tests run about three times slower here than on Linux, and TestApply
    # and TestPlan take most of that time, so the run is split across three
    # jobs: TestApply, TestPlan, and everything else. The filter goes in
    # GOFLAGS so that the regular expression never passes through make or the
    # shell. \b keeps TestApplyFrom and TestPlan_* out of the first two shards.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: apply
            goflags: -run=^TestApply\b
          - shard: plan
            goflags: -run=^TestPlan\b
          - shard: rest
            goflags: -skip=^Test(Apply|Plan)\b
    env:
      CGO_ENABLED: "1"
      # The runner's PostgreSQL listens on the default port; the Makefile
      # otherwise defaults to the port compose.yaml publishes locally.
      PGPORT: "5432"
      # Every plan, apply and dump opens its own connection, and the fixtures
      # add up to more than a thousand of them. sslmode=disable takes the SSL
      # negotiation round-trip out of each one; the server is on loopback and
      # has SSL off anyway, so there is nothing to negotiate.
      TEST_PISTA_CONN_STR: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      # Keep LF line endings; test fixtures are compared byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install GNU Make
        run: choco install -y --no-progress make
      # A PostgreSQL backend on Windows is a new process rather than a fork,
      # and Defender scans every one of them. The tests open a connection per
      # fixture, so that scan sits on the hot path more than a thousand times.
      # go test also links a large cgo test binary per package under TEMP and
      # runs it, and each new executable is scanned too. Real-time protection
      # has nothing to guard on a throwaway runner, so turn it off. This only
      # buys time, so warn and carry on if the image stops allowing it.
      - name: Disable Defender real-time protection
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          } catch {
            Write-Warning "could not disable Defender real-time protection: $_"
          }
      # PostgreSQL is preinstalled on the runner image but the service is
      # stopped and disabled by default. PGDATA / PGBIN are set by the image
      # and point at that install. Switch it to trust auth to match the Linux
      # jobs (POSTGRES_HOST_AUTH_METHOD=trust), then start it. Fail loudly if
      # the image ever stops providing these paths.
      #
      # Every fixture drops and recreates `public`, and each of those commits
      # waits on a WAL flush, which is slow on the runner's disk. The database
      # is thrown away with the runner, so durability buys nothing here; the
      # settings go in before the service starts so no restart is needed.
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PGDATA -or -not $env:PGBIN) {
            throw "PGDATA/PGBIN not set by the runner image; update this step"
          }
          Set-Content -Path "$env:PGDATA\pg_hba.conf" -Value "host all all 127.0.0.1/32 trust`nhost all all ::1/128 trust"
          Add-Content -Path "$env:PGDATA\postgresql.conf" -Value "`nfsync = off`nsynchronous_commit = off`nfull_page_writes = off"
          Get-Service -Name postgresql* | Set-Service -StartupType Manual -PassThru | Start-Service
          & "$env:PGBIN\pg_isready" -h localhost -t 30
          & "$env:PGBIN\psql" -h localhost -U postgres -Atc "SHOW fsync"
          # `make test` wipes the database through psql first, and the image
          # leaves PGBIN off PATH, so put it on.
          Add-Content -Path $env:GITHUB_PATH -Value $env:PGBIN
      - name: Build
        run: go build -o pista.exe ./cmd/pista
      - name: Smoke test
        run: ./pista.exe --help
      - run: make TEST_OPTS='-coverprofile=coverage.txt'
        env:
          GOFLAGS: ${{ matrix.goflags }}
      # Uploaded even when the tests failed; the coverage job reports on it.
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-windows-${{ matrix.shard }}
          path: coverage.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 16, 17, 18]
    env:
      # One version per job, so the service can keep the default port; the
      # Makefile otherwise defaults to the port compose.yaml publishes locally.
      PGPORT: "5432"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make TEST_OPTS='-coverprofile=coverage.txt'
      - run: make test-scenario
      # test-fidelity reloads a dump and compares pg_dump output, and pg_dump
      # refuses a server newer than itself. The runner ships an older client
      # than the newest server in the matrix, so install the newest one; it
      # dumps every version in the matrix.
      - name: Install the PostgreSQL client
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
      - run: make test-fidelity
      # Uploaded even when the tests failed; the coverage job reports on it.
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-pg${{ matrix.postgres }}
          path: coverage.txt

  dsql:
    runs-on: ubuntu-latest
    # TestDSQL replays a recording of an Aurora DSQL cluster through pgstub,
    # so it needs no database. It runs only with TEST_PISTA_DSQL set, which the
    # test jobs leave unset, so it runs here once. A failure here usually means
    # a statement pistachio sends changed: run `make record-dsql`.
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-dsql TEST_OPTS='-coverprofile=coverage.txt'
      # Uploaded even when the test failed; the coverage job reports on it.
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-dsql
          path: coverage.txt

  coverage:
    runs-on: ubuntu-latest
    # Merges the profiles of the test jobs, since each covers only part of
    # the code, and on main publishes the report to the Pages of
    # winebarrel/pistachio-coverage. A profile that did not arrive stops the
    # job before the push, so the report there stays the last complete one.
    needs: [windows, test, dsql]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # Each artifact holds a file named coverage.txt, so they are kept in a
      # directory each rather than merged into one.
      - uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/coverage
          pattern: coverage-*
      - name: Check that every profile arrived
        run: |
          for name in windows-apply windows-plan windows-rest pg15 pg16 pg17 pg18 dsql; do
            if [ ! -f "$RUNNER_TEMP/coverage/coverage-$name/coverage.txt" ]; then
              echo "::error::coverage-$name did not arrive"
              exit 1
            fi
          done
      - id: report
        run: |
          total=$(scripts/coverage-report.sh "$RUNNER_TEMP/site" "$RUNNER_TEMP"/coverage/*/coverage.txt)
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Coverage: $total%" >> "$GITHUB_STEP_SUMMARY"
      - id: app-token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: pistachio-coverage
          permission-contents: write
      # A new orphan commit each time, so the repository holds only the
      # latest report. GitHub signs a commit made through the API, not one
      # pushed, so the files go up as blobs and the commit is made from
      # their tree.
      - name: Publish the report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ runner.temp }}/site
        run: |
          # .nojekyll included.
          shopt -s dotglob
          : > "$RUNNER_TEMP/entries"
          for path in *; do
            sha=$(base64 -w0 "$path" | jq -Rsc '{content: ., encoding: "base64"}' |
              gh api "repos/$GH_REPO/git/blobs" --input - --jq .sha)
            jq -nc --arg path "$path" --arg sha "$sha" \
              '{path: $path, mode: "100644", type: "blob", sha: $sha}' >> "$RUNNER_TEMP/entries"
          done
          tree=$(jq -s '{tree: .}' "$RUNNER_TEMP/entries" |
            gh api "repos/$GH_REPO/git/trees" --input - --jq .sha)
          commit=$(gh api "repos/$GH_REPO/git/commits" \
            -f message="Coverage of winebarrel/pistachio@$GITHUB_SHA" -f tree="$tree" --jq .sha)
          gh api -X PATCH "repos/$GH_REPO/git/refs/heads/main" -f sha="$commit" -F force=true --silent
        env:
          GH_REPO: winebarrel/pistachio-coverage
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      # Checked after the push, so the badge shows a drop too.
      - name: Check the threshold
        run: |
          awk -v total="$TOTAL" 'BEGIN {
            if (total < 88) {
              printf "::error::coverage %s%% is below 88%%\n", total
              exit 1
            }
          }'
        env:
          TOTAL: ${{ steps.report.outputs.total }}

  dsql-proxy:
    runs-on: ubuntu-latest
    # The DSQL scenarios in test/dsql/, against internal/dsqlproxy in front of
    # PostgreSQL 16, the version DSQL speaks. The proxy answers the way the
    # live recording in testdata/dsql/ says DSQL does, so this checks without
    # a cluster that what pistachio writes for DSQL applies and plans clean.
    env:
      # The service keeps the default port; the Makefile otherwise defaults to
      # the port compose.yaml publishes locally.
      PGPORT: "5432"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-dsql-proxy

  dsql-recording:
    runs-on: ubuntu-latest
    # Records TestDSQL through internal/dsqlproxy and compares the result with
    # testdata/dsql/dsql.yaml, which a live cluster made, so a proxy that no
    # longer answers the way the cluster did fails here. A pull request that
    # changes a statement pistachio sends fails here as well as in dsql until
    # the recording is made again with make record-dsql; the diff in the log
    # then shows how the proxy's answers moved.
    env:
      PGPORT: "5432"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make check-dsql-recording

  samples:
    runs-on: ubuntu-latest
    # Checks pista against real-world sample schemas: downloads each from its
    # external host, loads it into an isolated database, then verifies that
    # `pista dump` plans back to "No changes". A diff means the catalog reader
    # and parser disagree.
    #
    # The samples load one after another, so the run is split across three
    # jobs; test/samples/run.sh picks every third sample for each.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # The service keeps the default port; the Makefile otherwise defaults to
      # the port compose.yaml publishes locally.
      PGPORT: "5432"
      SAMPLE_SHARD: ${{ matrix.shard }}/3
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # The discourse sample declares `CREATE EXTENSION vector`, the osm and
      # inaturalist samples `CREATE EXTENSION postgis`, and the dhis2 loader
      # creates postgis for the sample, neither of which the official image
      # ships. Install both from PGDG into the running service container;
      # CREATE EXTENSION reads the control file when it is called, so the
      # server does not need a restart. compose.yaml does the same for local
      # runs.
      - name: Install pgvector and PostGIS
        run: |
          cid=$(docker ps --filter ancestor=postgres:18 --format '{{.ID}}')
          [ -n "$cid" ] || { echo "postgres service container not found" >&2; exit 1; }
          docker exec -u root "$cid" bash -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-18-pgvector postgresql-18-postgis-3'
      # Every sample source is pinned, so a body test/samples/fetch.sh kept on
      # an earlier run is still the one the loader would download. The key
      # follows sample-db.mk, where the URLs are, and falls back to the shard's
      # last entry, so a change to one sample leaves the others cached. The
      # bodies no sample read in this run are removed before the save, which
      # keeps a replaced pin from staying in the cache.
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/sample-cache
          key: samples-${{ matrix.shard }}-${{ hashFiles('sample-db.mk') }}
          restore-keys: samples-${{ matrix.shard }}-
      - run: touch "$RUNNER_TEMP/sample-start"
      - run: make test-samples
        env:
          SAMPLE_CACHE: ${{ runner.temp }}/sample-cache
      - name: Drop cached bodies this run did not read
        run: find "$RUNNER_TEMP/sample-cache" -type f ! -newer "$RUNNER_TEMP/sample-start" -delete
